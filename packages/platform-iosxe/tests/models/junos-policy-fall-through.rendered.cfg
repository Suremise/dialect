router bgp 65000
 no bgp default ipv4-unicast
 neighbor 198.51.100.2 remote-as 65000
 !
 address-family ipv4
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map FROM-PEER in
  neighbor 198.51.100.2 route-map TO-PEER out
 exit-address-family
!
ip prefix-list CUSTOMERS seq 1 permit 192.0.2.0/24 le 32
ip prefix-list BOGONS seq 1 permit 10.0.0.0/8 le 32
!
route-map FROM-PEER deny 1
 match ip address prefix-list BOGONS
!
route-map FROM-PEER permit 2
 match ip address prefix-list CUSTOMERS
 set local-preference 200
!
route-map FROM-PEER permit 12
!
route-map TO-PEER permit 1
 match ip address prefix-list CUSTOMERS
!
route-map TO-PEER deny 2
!
end
