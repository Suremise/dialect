vrf definition CUST
 rd 65000:10
 route-target import 65000:10
 route-target export 65000:10
 !
 address-family ipv4
  import map CUST-IN
 exit-address-family
!
ip prefix-list CUST-NETS seq 1 permit 192.0.2.0/24 le 32
!
route-map CUST-IN permit 1
 match ip address prefix-list CUST-NETS
!
route-map CUST-IN deny 2
!
route-map CUST-OUT permit 1
 set local-preference 200
!
route-map CUST-OUT-2 permit 1
!
end
