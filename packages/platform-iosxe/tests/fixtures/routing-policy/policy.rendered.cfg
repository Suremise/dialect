hostname edge-r3
!
router bgp 65000
 no bgp default ipv4-unicast
 neighbor 198.51.100.2 remote-as 65001
 neighbor 2001:db8:1::2 remote-as 65001
 !
 address-family ipv4
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map FROM-TRANSIT in
  neighbor 198.51.100.2 route-map TO-TRANSIT out
 exit-address-family
 !
 address-family ipv6
  neighbor 2001:db8:1::2 activate
  neighbor 2001:db8:1::2 route-map V6-IN in
 exit-address-family
!
ip as-path access-list 10 permit ^65001_
ip as-path access-list 10 deny .*
ip as-path access-list 20 permit _65010$
ip community-list 1 permit 65000:1
ip community-list 101 permit _65000:9[0-9]_
ip community-list standard CUSTOMERS permit 65000:100
ip community-list standard CUSTOMERS permit 65000:200 no-export
ip community-list standard BLOCKED deny 65000:666
ip community-list standard BLOCKED permit local-AS gshut
ip community-list expanded TRANSIT-ANY permit ^65001:[0-9]+$
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list CUSTOMER-NETS description Customer aggregates
ip prefix-list CUSTOMER-NETS seq 10 permit 192.0.2.0/24 le 28
ip prefix-list CUSTOMER-NETS seq 20 deny 198.51.100.0/24 ge 25
ip prefix-list CUSTOMER-NETS seq 30 permit 203.0.113.0/24 ge 25 le 27
ip prefix-list CUSTOMER-NETS seq 35 permit 10.0.0.0/8
ipv6 prefix-list V6-NETS seq 10 permit 2001:db8::/32 le 48
!
route-map FROM-TRANSIT deny 5
 match as-path 20
!
route-map FROM-TRANSIT permit 10
 match community CUSTOMERS TRANSIT-ANY
 match ip address prefix-list CUSTOMER-NETS
 set comm-list BLOCKED delete
 set community 65000:10 additive
 set local-preference 150
!
route-map FROM-TRANSIT permit 20
 match as-path 10
 match tag 100 200
 set ip next-hop 198.51.100.1
 set metric 20
 set tag 7
!
route-map TO-TRANSIT permit 10
 match ip address prefix-list DEFAULT
 set as-path prepend 65000 65000
 set community 65000:1 no-export
!
route-map TO-TRANSIT permit 20
 match community 1 101
!
route-map V6-IN permit 10
 match ipv6 address prefix-list V6-NETS
 set ipv6 next-hop 2001:db8::1
!
end
