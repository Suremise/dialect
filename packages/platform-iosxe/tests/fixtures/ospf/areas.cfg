hostname core-r1
!
vrf definition CUST
 rd 65000:10
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description Backbone link
 ip address 198.51.100.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
interface GigabitEthernet0/0/1
 ip address 198.51.100.5 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 20
 ip ospf cost 30
!
interface GigabitEthernet0/0/2
 ip address 203.0.113.1 255.255.255.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 PLACEHOLDER-KEY
!
interface GigabitEthernet0/0/3
 ip address 203.0.114.1 255.255.255.0
!
interface GigabitEthernet0/0/4
 vrf forwarding CUST
 ip address 10.10.0.1 255.255.255.0
!
interface GigabitEthernet0/0/5
 ip address 10.20.0.1 255.255.255.0
 ip ospf cost 99
!
router ospf 1
 router-id 192.0.2.1
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 no passive-interface GigabitEthernet0/0/1
 network 192.0.2.1 0.0.0.0 area 0
 network 198.51.100.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.255 area 10
 network 203.0.114.0 0.0.0.255 area 20
 network 172.16.0.0 0.15.255.255 area 30
 area 10 stub
 area 20 nssa
 area 0 authentication message-digest
 log-adjacency-changes
!
router ospf 2 vrf CUST
 router-id 10.10.0.1
 network 10.10.0.0 0.0.0.255 area 0
!
end
