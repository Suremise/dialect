hostname core-r1
!
vrf definition CUST
 rd 65000:10
 !
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description Backbone link
 ip address 198.51.100.1 255.255.255.252
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
interface GigabitEthernet0/0/1
 ip address 198.51.100.5 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 30
!
interface GigabitEthernet0/0/2
 ip address 203.0.113.1 255.255.255.0
 ip ospf authentication message-digest
!
interface GigabitEthernet0/0/3
 ip address 203.0.114.1 255.255.255.0
!
interface GigabitEthernet0/0/4
 vrf forwarding CUST
 ip address 10.10.0.1 255.255.255.0
!
interface GigabitEthernet0/0/5
 ip address 10.20.0.1 255.255.255.0
!
router ospf 1
 router-id 192.0.2.1
 area 0 authentication message-digest
 area 10 stub
 area 20 nssa
 network 192.0.2.1 0.0.0.0 area 0
 network 198.51.100.1 0.0.0.0 area 0
 network 203.0.113.1 0.0.0.0 area 10
 network 203.0.114.1 0.0.0.0 area 20
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0/2
 passive-interface GigabitEthernet0/0/3
!
router ospf 2 vrf CUST
 router-id 10.10.0.1
 network 10.10.0.1 0.0.0.0 area 0
!
end
