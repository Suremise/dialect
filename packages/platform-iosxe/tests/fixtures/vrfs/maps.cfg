hostname pe-1
!
vrf definition CUST
 rd 65000:10
 !
 address-family ipv4
  route-target import 65000:10
  route-target export 65000:10
  import map CUST-IN
  export map CUST-OUT
 exit-address-family
 !
 address-family ipv6
  route-target import 65000:10
  route-target export 65000:10
  import map CUST-IN
  export map CUST-OUT
 exit-address-family
!
vrf definition LEGACY
 rd 65000:20
 route-target both 65000:20
 import map OLD
 no import map OLD
!
route-map CUST-IN permit 10
 match community HUB
 set local-preference 200
!
route-map CUST-OUT permit 10
 set community 65000:99 additive
!
ip community-list standard HUB permit 65000:1
!
end