hostname edge-r1
!
vrf definition CUST
 rd 65000:10
 route-target both 65000:10
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.1 255.255.255.252
 ipv6 address 2001:DB8:1::1/64
!
interface GigabitEthernet0/0/1
 vrf forwarding CUST
 ip address 10.10.0.1 255.255.255.252
!
router bgp 65000
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65000
 neighbor IBGP update-source Loopback0
 neighbor IBGP description Route reflectors
 neighbor 192.0.2.2 peer-group IBGP
 neighbor 192.0.2.3 peer-group IBGP
 neighbor 198.51.100.2 remote-as 65001
 neighbor 198.51.100.2 description Transit A
 neighbor 198.51.100.2 ebgp-multihop 2
 neighbor 203.0.113.9 remote-as 65002
 neighbor 2001:DB8:1::2 remote-as 65001
 !
 address-family ipv4
  neighbor IBGP activate
  neighbor 198.51.100.2 route-map TRANSIT-IN in
  neighbor 198.51.100.2 route-map TRANSIT-OUT out
  no neighbor 203.0.113.9 activate
  no neighbor 2001:DB8:1::2 activate
 exit-address-family
 !
 address-family ipv6
  neighbor 2001:DB8:1::2 activate
  neighbor 2001:DB8:1::2 route-map V6-IN in
 exit-address-family
 !
 address-family ipv4 vrf CUST
  bgp router-id 10.10.0.1
  neighbor 10.10.0.2 remote-as 65100
  neighbor 10.10.0.2 description Customer
  neighbor 10.10.0.2 activate
 exit-address-family
!
route-map TRANSIT-IN permit 10
 set local-preference 200
!
route-map TRANSIT-OUT permit 10
 set metric 50
!
route-map V6-IN permit 10
!
end
