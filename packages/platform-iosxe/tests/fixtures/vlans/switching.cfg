hostname access-sw1
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
 name SERVERS-A
!
vlan 30,40-42
!
vlan 50
 name OLD
!
no vlan 41,50
!
interface GigabitEthernet1/0/1
 description User port
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface GigabitEthernet1/0/2
 description Uplink trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 10
 switchport trunk allowed vlan 10,20,100-200
 switchport trunk allowed vlan add 30
 switchport trunk allowed vlan remove 150-200
 switchport mode trunk
!
interface GigabitEthernet1/0/3
 switchport trunk allowed vlan 10
 switchport trunk allowed vlan except 1-9,11-4094
 switchport mode trunk
!
interface GigabitEthernet1/0/4
 switchport trunk allowed vlan remove 2-4094
 switchport mode trunk
!
interface GigabitEthernet1/0/5
 switchport trunk allowed vlan none
 switchport mode trunk
!
interface GigabitEthernet1/0/6
 switchport mode access
 switchport access vlan 20
 switchport mode trunk
 no switchport access vlan
 switchport trunk allowed vlan all
!
interface GigabitEthernet1/0/7
 switchport mode access
 switchport access vlan 20
 no switchport
 ip address 192.0.2.1 255.255.255.252
!
interface GigabitEthernet1/0/8
 switchport
 switchport access vlan 60
!
interface Vlan10
 description Users gateway
 ip address 198.51.100.1 255.255.255.0
!
interface Vlan20
 ip address 198.51.100.129 255.255.255.128
 shutdown
!
end
