hostname edge-r5
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.1 255.255.255.252
 ip access-group ODD in
 ip access-group ODD-LAST out
!
ip access-list extended ODD
 10 permit ip 10.0.0.0 0.255.0.255 any
 20 deny ip any any
!
ip access-list extended ODD-LAST
 10 permit tcp any any eq 22
 20 permit ip 10.0.0.0 0.255.0.255 any
!
end