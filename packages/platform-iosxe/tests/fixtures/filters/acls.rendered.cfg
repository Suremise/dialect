hostname edge-r4
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.1 255.255.255.252
 ipv6 address 2001:db8:1::1/64
 ip access-group EDGE-IN in
 ip access-group 10 out
 ipv6 traffic-filter EDGE6-IN in
!
interface GigabitEthernet0/0/1.20
 encapsulation dot1Q 20
 ip address 10.20.0.1 255.255.255.0
 ip access-group EDGE-IN in
!
ip access-list standard 10
 10 permit 192.0.2.0 0.0.0.255
 20 permit host 192.0.2.200
 30 deny any log
!
ip access-list extended 110
 10 permit tcp host 192.0.2.1 any eq 80
 20 deny ip any any
!
ip access-list extended EDGE-IN
 remark Management SSH from the jump hosts
 10 permit tcp 192.0.2.0 0.0.0.255 host 198.51.100.1 eq 22 log
 20 permit tcp any gt 1023 198.51.100.0 0.0.0.3 range 80 81
 30 permit tcp any any neq 23 established
 40 permit udp any eq 53 any lt 1024
 50 permit icmp any any 8
 60 permit icmp any any 3 4
 70 permit tcp any any match-all +syn -ack
 80 permit tcp any any match-all +syn
 90 deny ip any any fragments
 100 permit ip any any dscp 46
 110 permit 47 any any
 120 deny ip 10.0.0.0 0.255.255.255 any
 remark everything else
 130 permit ip any any
!
ipv6 access-list EDGE6-IN
 remark Neighbour discovery
 sequence 10 permit icmp any any 135
 sequence 20 permit icmp any any 136
 sequence 30 permit tcp 2001:db8::/32 host 2001:db8:1::1 eq 22
 sequence 40 deny ipv6 any any log
!
end
