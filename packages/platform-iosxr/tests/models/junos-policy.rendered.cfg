vrf CUST
 address-family ipv4 unicast
  import route-policy IMPORT
  import route-target
   65000:10
  !
 !
 address-family ipv6 unicast
  import route-policy IMPORT
  import route-target
   65000:10
  !
 !
!
prefix-set LO
  192.0.2.0/24 le 32
end-set
!
route-policy IMPORT
  if destination in LO then
    done
  endif
  pass
end-policy
!
