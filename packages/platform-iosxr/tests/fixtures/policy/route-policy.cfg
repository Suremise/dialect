hostname pe1
prefix-set CUSTOMERS
  192.0.2.0/24 le 32,
  198.51.100.0/24
end-set
!
community-set BLACKHOLE
  65535:666
end-set
!
route-policy CUSTOMER-IN
if destination in CUSTOMERS then
  if community matches-any BLACKHOLE then
    set next-hop discard
  else
    pass
  endif
elseif destination in (0.0.0.0/0) then
  drop
endif
end-policy
!
