hostname pe1
!
prefix-set OK
  10.0.0.0/8 le 24
end-set
!
route-policy NESTED
  if destination in OK then
    if tag eq 1 then
      drop
    endif
  endif
end-policy
!
route-policy ELSEIF
  if destination in OK then
    done
  elseif tag eq 1 then
    drop
  endif
end-policy
!
route-policy PARAM($tag)
  if tag eq $tag then
    drop
  endif
end-policy
!
route-policy APPLY
  apply NESTED
end-policy
!
route-policy INLINE
  if destination in (10.0.0.0/8 le 24) then
    done
  endif
end-policy
!
route-policy OR
  if destination in OK or tag eq 1 then
    done
  endif
end-policy
!
route-policy NOT
  if not destination in OK then
    drop
  endif
end-policy
!
route-policy PASS-ON
  if destination in OK then
    pass
  endif
  if tag eq 1 then
    drop
  endif
end-policy
!
route-policy IGP-COST
  set med igp-cost
  pass
end-policy
!
route-policy DISCARD
  if destination in OK then
    set next-hop discard
    done
  endif
end-policy
!
route-policy AFTER-DONE
  if destination in OK then
    done
    set tag 1
  endif
end-policy
!
route-policy EVERY-FIRST
  drop
  if destination in OK then
    done
  endif
end-policy
!
community-set DFA
  dfa-regex '_65000:.*'
end-set
!
community-set WILDCARD
  65000:*
end-set
!
community-set RANGE
  65000:[100..200]
end-set
!
as-path-set PASSES
  passes-through '65001'
end-set
!
as-path-set LENGTH
  length ge 10
end-set
!
prefix-set EMPTY
end-set
!
extcommunity-set rt TARGETS
  65000:1
end-set
!
route-policy USES-WILDCARD
  if community matches-any WILDCARD then
    drop
  endif
end-policy
!
