hostname pe1
!
vrf CUST
 address-family ipv4 unicast
  import route-policy CUST-IMPORT
  import route-target
   65000:10
  !
 !
!
prefix-set LOOPBACKS
  # Loopbacks, both families
  192.0.2.0/24 ge 32,
  198.51.100.0/24 le 28,
  203.0.113.0/24 ge 25 le 27,
  10.0.0.0/8 eq 16,
  172.16.0.0/12,
  2001:db8::/32 ge 64 le 128
end-set
!
community-set CUSTOMER
  65000:100,
  no-export,
  local-AS,
  ios-regex '_65000:9[0-9]_',
  ios-regex '_65000:(1,|2  )'
end-set
!
community-set TAGGED
  65000:200
end-set
!
as-path-set FROM-PEER
  ios-regex '^65001_',
  ios-regex '_65002$',
  ios-regex '_65003  65004_'
end-set
!
route-policy TRANSIT-IN
  # Customers' loopbacks, preferred and tagged
  if destination in LOOPBACKS and community matches-any CUSTOMER then
    set local-preference 200
    set med 10
    set community TAGGED additive
    done
  endif
  if as-path in FROM-PEER then
    prepend as-path 65000 2
    delete community in CUSTOMER
    set next-hop 192.0.2.254
    done
  endif
  if tag eq 99 then
    drop
  endif
  set tag 7
  pass
end-policy
!
route-policy TRANSIT-OUT
  if community matches-any TAGGED then
    set community TAGGED
    set next-hop self
    pass
  else
    drop
  endif
end-policy
!
route-policy CUST-IMPORT
  if destination in LOOPBACKS then
    pass
  endif
end-policy
!
route-policy DROP-ALL
end-policy
!
router bgp 65000
 bgp router-id 192.0.2.1
 address-family ipv4 unicast
 !
 neighbor 198.51.100.1
  remote-as 64512
  address-family ipv4 unicast
   route-policy TRANSIT-IN in
   route-policy TRANSIT-OUT out
  !
 !
 neighbor 198.51.100.2
  remote-as 64513
  address-family ipv4 unicast
   route-policy DROP-ALL in
   route-policy DROP-ALL out
  !
 !
!
