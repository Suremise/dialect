hostname pe1
!
vrf CUST
!
interface Loopback0
 ipv4 address 192.0.2.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 ipv4 address 198.51.100.1 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 ipv4 address 198.51.100.3 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 vrf CUST
 ipv4 address 203.0.113.1 255.255.255.0
!
router ospf CORE
 router-id 192.0.2.1
 cost 10
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   hello-interval 5
   dead-interval 20
  !
 !
 area 10
  stub
  authentication message-digest
  interface GigabitEthernet0/0/0/1
   cost 100
   message-digest-key 1 md5 encrypted PLACEHOLDER-OSPF-KEY
  !
 !
 vrf CUST
  router-id 192.0.2.1
  area 0
   interface GigabitEthernet0/0/0/2
    passive enable
   !
  !
 !
!
