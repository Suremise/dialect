hostname pe1
!
ipv4 access-list EDGE-IN
 10 remark management
 20 permit tcp 192.0.2.0 0.0.0.255 host 198.51.100.1 eq ssh log
 30 permit tcp any 198.51.100.0/24 range 8080 8090 established
 40 permit udp any eq domain any gt 1023 counter DNS
 50 permit icmp any any echo
 60 permit icmp any any 3 4
 70 deny ipv4 10.0.0.0 0.255.255.255 any fragments
 80 permit tcp any any lt 1024 dscp af11
 permit ospf any any
 deny ipv4 any any log
!
ipv6 access-list EDGE6-IN
 10 permit tcp any 2001:db8::/32 eq www
 20 permit icmpv6 any any packet-too-big
 30 permit icmpv6 any any address-unreachable
 40 permit ipv6 host 2001:db8::1 any
!
ipv4 access-list EMPTY
!
interface GigabitEthernet0/0/0/0
 ipv4 address 192.0.2.1 255.255.255.0
 ipv4 access-group EDGE-IN ingress
 ipv4 access-group EMPTY egress
 ipv6 access-group EDGE6-IN ingress
!
interface GigabitEthernet0/0/0/1.100
 encapsulation dot1q 100
 ipv4 access-group EDGE-IN ingress
!
