hostname pe1
!
ipv4 access-list WILDCARD-FIRST
 10 deny ipv4 10.0.0.0 0.255.0.255 any
 20 permit ipv4 any any
!
ipv4 access-list LAST-ONLY
 10 permit tcp any any eq 22
 20 deny ipv4 any any ttl eq 1
!
ipv4 access-list OBJECT-GROUP
 10 permit ipv4 net-group SERVERS any
 20 deny ipv4 any any
!
ipv4 access-list ABF
 10 permit ipv4 any any nexthop1 ipv4 192.0.2.254
 20 deny ipv4 any any
!
ipv4 access-list NEQ
 10 permit tcp any any neq 23
 20 deny ipv4 any any
!
ipv4 access-list LOG-INPUT
 10 permit ipv4 any any log-input
 20 deny ipv4 any any
!
interface GigabitEthernet0/0/0/0
 ipv4 access-group WILDCARD-FIRST ingress
 ipv4 access-group LAST-ONLY egress
 ipv6 access-group MISSING ingress
!
