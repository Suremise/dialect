hostname pe1
!
ipv4 access-list EDGE-IN
 20 permit tcp 192.0.2.0/24 host 198.51.100.1 eq 22 log
 30 permit tcp any 198.51.100.0/24 range 8080 8090 established
 40 permit udp any eq 53 any gt 1023 counter DNS
 50 permit icmp any any 8
 60 permit icmp any any 3 4
 70 deny ipv4 10.0.0.0/8 any fragments
 80 permit tcp any any lt 1024 dscp 10
 90 permit ospf any any
 100 deny ipv4 any any log
!
ipv4 access-list EMPTY
!
ipv6 access-list EDGE6-IN
 10 permit tcp any 2001:db8::/32 eq 80
 20 permit icmpv6 any any 2
 30 permit icmpv6 any any 1 3
 40 permit ipv6 host 2001:db8::1 any
!
interface GigabitEthernet0/0/0/0
 ipv4 address 192.0.2.1 255.255.255.0
 ipv4 access-group EDGE-IN ingress
 ipv4 access-group EMPTY egress
 ipv6 access-group EDGE6-IN ingress
!
interface GigabitEthernet0/0/0/1
!
interface GigabitEthernet0/0/0/1.100
 ipv4 access-group EDGE-IN ingress
 encapsulation dot1q 100
!
