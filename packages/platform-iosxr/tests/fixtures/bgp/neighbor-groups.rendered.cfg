hostname pe1
!
vrf CUST
!
interface Loopback0
 ipv4 address 192.0.2.1 255.255.255.255
!
router bgp 65000
 bgp router-id 192.0.2.1
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
 neighbor-group IBGP
  remote-as 65000
  update-source Loopback0
  address-family ipv4 unicast
   route-policy IBGP-IN in
   route-policy IBGP-OUT out
  !
 !
 neighbor 192.0.2.2
  use neighbor-group IBGP
  description rr1
 !
 neighbor 198.51.100.1
  remote-as 64512
  description transit
  ebgp-multihop 2
  address-family ipv4 unicast
   route-policy TRANSIT-IN in
   route-policy TRANSIT-OUT out
  !
 !
 neighbor 2001:db8::1
  remote-as 64513
  address-family ipv6 unicast
   route-policy PEER-IN in
  !
 !
 vrf CUST
  rd 65000:10
  bgp router-id 192.0.2.1
  address-family ipv4 unicast
  !
  neighbor 203.0.113.2
   remote-as 64600
   address-family ipv4 unicast
    route-policy CUST-IN in
    route-policy CUST-OUT out
   !
  !
 !
!
