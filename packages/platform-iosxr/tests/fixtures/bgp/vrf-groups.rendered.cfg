hostname pe2
!
vrf RED
!
vrf BLUE
!
route-policy CE-IN
  done
end-policy
!
route-policy CE-OUT
  done
end-policy
!
router bgp 65000
 bgp router-id 192.0.2.1
 address-family ipv4 unicast
 !
 neighbor-group CE
  remote-as 64600
  description customer-edge
  address-family ipv4 unicast
   route-policy CE-IN in
   route-policy CE-OUT out
  !
 !
 neighbor 198.51.100.1
  use neighbor-group CE
 !
 vrf RED
  rd 65000:1
  address-family ipv4 unicast
  !
  neighbor 203.0.113.2
   use neighbor-group CE
   description red-ce
  !
 !
 vrf BLUE
  rd 65000:2
  address-family ipv4 unicast
  !
  neighbor 203.0.113.6
   use neighbor-group CE
  !
 !
!
