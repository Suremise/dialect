system {
    host-name r1;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.0/31;
            }
        }
    }
}
routing-options {
    autonomous-system 65000;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                authentication {
                    md5 1 key "$9$placeholder";
                }
            }
        }
    }
    bgp {
        group ext {
            type external;
            family inet {
                unicast;
            }
            peer-as 65001;
            neighbor 192.0.2.1 {
                authentication-key "$9$placeholder";
            }
        }
    }
}
