/* A phase 1 Junos config for convert mode: system, DNS, interfaces, static routes, NTP, syslog and SNMP. */
system {
    host-name edge-1;
    domain-name example.net;
    domain-search example.net;
    name-server {
        192.0.2.53;
        198.51.100.53;
    }
    ntp {
        server 192.0.2.123 prefer;
        server 198.51.100.123;
    }
    syslog {
        host 192.0.2.114 {
            any warning;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "uplink to core";
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ge-0/0/1 {
        vlan-tagging;
        unit 10 {
            description "customer A";
            vlan-id 10;
            family inet {
                address 198.51.100.1/30;
            }
        }
    }
    xe-0/1/0 {
        disable;
        mtu 9192;
    }
    lo0 {
        unit 0 {
            family inet {
                address 203.0.113.1/32;
            }
        }
    }
}
snmp {
    location "rack 4";
    contact "noc";
    community example-ro {
        authorization read-only;
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 192.0.2.2;
        route 10.0.0.0/8 {
            next-hop 192.0.2.2;
            preference 200;
        }
        route 192.0.2.128/25 discard;
        route 192.0.2.192/26 reject;
        route 198.51.100.64/26 {
            qualified-next-hop 192.0.2.2 {
                interface ge-0/0/0.0;
            }
        }
    }
}
protocols {
    lldp {
        interface all;
    }
}
