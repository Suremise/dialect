feature bgp

router bgp 65000
  address-family ipv4 unicast
  neighbor 198.51.100.1
    remote-as 64512
    address-family ipv4 unicast
      route-map FROM-PEER in
  neighbor 198.51.100.5
    remote-as 64513
    address-family ipv4 unicast
      route-map FROM-PEER in
      route-map TO-PEER out
  neighbor 192.0.2.2
    remote-as 65000
    address-family ipv4 unicast
