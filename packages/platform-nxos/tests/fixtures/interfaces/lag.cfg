!Command: show running-config
hostname leaf-1

feature lacp

interface port-channel10
  description Uplink bundle to spine
  switchport
  switchport mode trunk
  lacp min-links 2

interface port-channel20
  description Static bundle to a server
  switchport

interface Ethernet1/1
  description Spine link A
  switchport
  switchport mode trunk
  channel-group 10 mode active

interface Ethernet1/2
  description Spine link B
  switchport
  switchport mode trunk
  channel-group 10 force mode active

interface Ethernet1/3
  switchport
  channel-group 20

interface Ethernet1/4
  switchport
  channel-group 20

interface Ethernet1/5
  description Joins a bundle the text doesn't configure
  switchport
  channel-group 30 mode passive

interface Ethernet1/6
  description Left its bundle
  switchport
  channel-group 10 mode active
  no channel-group

interface port-channel40
  description Routed bundle to a firewall
  no switchport
  mtu 9216
  ip address 192.0.2.1/30

interface Ethernet1/7
  description Firewall link A
  no switchport
  mtu 9216
  channel-group 40 mode active

interface Ethernet1/8
  description Firewall link B
  no switchport
  mtu 9216
  channel-group 40 mode active
