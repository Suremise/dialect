hostname leaf-4

interface Ethernet1/1
  no switchport
  ip address 198.51.100.1/30
  ipv6 address 2001:db8:1::1/64
  ip access-group EDGE-IN in
  ipv6 traffic-filter EDGE6-IN in

interface Ethernet1/2
  switchport
  ip port access-group EDGE-IN in

ip access-list EDGE-IN
  9 remark SSH from the jump hosts
  10 permit tcp 192.0.2.0/24 198.51.100.1/32 eq 22 log
  20 permit tcp any gt 1023 198.51.100.0/30 range 80 81
  30 permit tcp any any neq 23 established
  40 permit udp any eq 53 any lt 1024
  50 permit icmp any any 8
  60 permit icmp any any 3 4
  70 permit tcp any any syn
  80 deny ip any any fragments
  90 permit ip any any dscp 46
  100 permit 47 any any
  110 deny ip 10.0.0.0/8 any
  129 remark everything else
  130 permit ip any any

ipv6 access-list EDGE6-IN
  10 permit icmp any any 135
  20 permit tcp 2001:db8::/32 2001:db8:1::1/128 eq 22
  30 deny ipv6 any any log
