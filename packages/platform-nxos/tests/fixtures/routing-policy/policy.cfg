hostname leaf-3
feature bgp
ip as-path access-list FROM-65001 seq 10 permit "^65001_"
ip as-path access-list FROM-65001 seq 20 deny ".*"
ip as-path access-list LONG-PATH permit "_65010 65020_"
ip community-list standard CUSTOMERS seq 5 permit 65000:100
ip community-list standard CUSTOMERS seq 10 permit 65000:200 no-export
ip community-list standard BLOCKED permit 65000:666
ip community-list standard BLOCKED permit local-AS
ip community-list expanded TRANSIT-ANY seq 5 permit "^65001:[0-9]+$"
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list CUSTOMER-NETS description Customer aggregates
ip prefix-list CUSTOMER-NETS seq 10 permit 192.0.2.0/24 le 28
ip prefix-list CUSTOMER-NETS seq 20 deny 198.51.100.0/24 ge 25
ip prefix-list CUSTOMER-NETS seq 30 permit 203.0.113.0/24 ge 25 le 27
ip prefix-list CUSTOMER-NETS seq 40 permit 10.0.0.0/8 eq 16
ip prefix-list CUSTOMER-NETS permit 10.1.0.0/16
ip prefix-list CUSTOMER-NETS seq 60 permit 10.2.0.0/16
no ip prefix-list CUSTOMER-NETS seq 60
ipv6 prefix-list V6-NETS seq 10 permit 2001:DB8::/32 le 48
route-map FROM-TRANSIT deny 5
  match as-path LONG-PATH
route-map FROM-TRANSIT permit 10
  match ip address prefix-list CUSTOMER-NETS
  match community CUSTOMERS TRANSIT-ANY
  set local-preference 150
  set community 65000:10 additive
  set comm-list BLOCKED delete
route-map FROM-TRANSIT permit 20
  match as-path FROM-65001
  match tag 100 200
  set metric 10
  set metric 20
  set tag 7
  set ip next-hop 198.51.100.1
route-map TO-TRANSIT permit 10
  description Advertise the default route
  match ip address prefix-list DEFAULT
  set as-path prepend 65000 65000
  set community 65000:1 no-export
route-map V6-IN permit 10
  match ipv6 address prefix-list V6-NETS
  set ipv6 next-hop 2001:DB8::1
route-map GONE permit 10
  set tag 1
no route-map GONE
router bgp 65000
  neighbor 198.51.100.2
    remote-as 65001
    address-family ipv4 unicast
      route-map FROM-TRANSIT in
      route-map TO-TRANSIT out
  neighbor 2001:db8:1::2
    remote-as 65001
    address-family ipv6 unicast
      route-map V6-IN in