hostname border-2

feature bgp

vrf context RED
  rd 65000:1

vrf context BLUE
  rd 65000:2

router bgp 65000
  router-id 192.0.2.1
  address-family ipv4 unicast
  template peer CE
    remote-as 64600
    description customer-edge
    address-family ipv4 unicast
      route-map CE-IN in
  neighbor 198.51.100.1
    inherit peer CE
  vrf RED
    address-family ipv4 unicast
    neighbor 203.0.113.2
      inherit peer CE
      description red-ce
  vrf BLUE
    address-family ipv4 unicast
    neighbor 203.0.113.6
      inherit peer CE

route-map CE-IN permit 10
  set local-preference 200
