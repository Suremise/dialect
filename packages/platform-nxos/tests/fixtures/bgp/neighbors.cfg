hostname border-1
feature bgp

vrf context CUST
  rd 65000:10

interface loopback0
  ip address 192.0.2.1/32

router bgp 65000
  router-id 192.0.2.1
  address-family ipv4 unicast
  address-family ipv6 unicast
  template peer IBGP
    remote-as 65000
    update-source loopback0
    address-family ipv4 unicast
  neighbor 192.0.2.2
    inherit peer IBGP
    description rr-client
  neighbor 198.51.100.1
    remote-as 64512
    description transit
    ebgp-multihop 2
    address-family ipv4 unicast
      route-map TRANSIT-IN in
      route-map TRANSIT-OUT out
  neighbor 2001:db8::1 remote-as 64513
    address-family ipv6 unicast
  vrf CUST
    router-id 192.0.2.1
    address-family ipv4 unicast
    neighbor 203.0.113.2
      remote-as 64600
      address-family ipv4 unicast
