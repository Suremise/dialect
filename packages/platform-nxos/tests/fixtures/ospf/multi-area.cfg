hostname spine-1
feature ospf

vrf context TENANT

interface loopback0
  ip address 192.0.2.255/32
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/1
  no switchport
  ip address 198.51.100.1/31
  ip ospf network point-to-point
  ip ospf cost 10
  ip ospf hello-interval 5
  ip ospf dead-interval 20
  ip router ospf UNDERLAY area 0.0.0.0

interface Ethernet1/2
  no switchport
  ip address 198.51.100.3/31
  ip ospf authentication message-digest
  ip ospf message-digest-key 1 md5 3 PLACEHOLDER-OSPF-KEY
  ip router ospf UNDERLAY area 10

interface Ethernet1/3
  no switchport
  vrf member TENANT
  ip address 203.0.113.1/24
  ip ospf passive-interface
  ip ospf authentication key-chain PLACEHOLDER-CHAIN
  ip router ospf UNDERLAY area 0.0.0.1

router ospf UNDERLAY
  router-id 192.0.2.255
  area 0.0.0.10 stub
  area 0.0.0.20 nssa
  vrf TENANT
    router-id 192.0.2.254
    area 0.0.0.1 authentication
