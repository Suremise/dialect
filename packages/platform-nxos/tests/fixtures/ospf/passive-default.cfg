hostname edge-1
feature ospf

interface Ethernet1/1
  no switchport
  ip address 192.0.2.1/30
  ip router ospf 1 area 0

interface Ethernet1/2
  no switchport
  ip address 192.0.2.5/30
  no ip ospf passive-interface
  ip router ospf 1 area 0

router ospf 1
  router-id 192.0.2.1
  passive-interface default
  network 192.0.2.0/24 area 0
