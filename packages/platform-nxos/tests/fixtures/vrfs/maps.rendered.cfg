hostname leaf-5

feature bgp

vrf context CUST
  rd 65000:10
  address-family ipv4 unicast
    route-target import 65000:10
    route-target export 65000:10
    import map CUST-IN
    export map CUST-OUT
  address-family ipv6 unicast
    route-target import 65000:10
    route-target export 65000:10
    import map CUST-IN
    export map CUST-OUT

ip prefix-list CUST-NETS seq 5 permit 192.0.2.0/24 le 32

route-map CUST-IN permit 10
  match ip address prefix-list CUST-NETS

route-map CUST-OUT permit 10
  set local-preference 200
