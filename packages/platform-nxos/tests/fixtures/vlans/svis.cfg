hostname leaf-1
feature interface-vlan

vrf context TENANT-A

vlan 10
  name SERVERS
vlan 20

interface Vlan10
  description servers gateway
  no shutdown
  ip address 192.0.2.1/24
  ip address 198.51.100.1/24 secondary

interface Vlan20
  no shutdown
  vrf member TENANT-A
  ip address 203.0.113.1/24
  ipv6 address 2001:db8:20::1/64

interface Vlan30
  description no VLAN 30 is defined: an interface of type vlan
  ip address 192.0.2.129/25
