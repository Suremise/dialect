routing-instances {
    INSTANCE {
        routing-options {
            static {
                route 192.0.2.1/31 discard;
            }
        }
        protocols {
            bgp {
                group GROUP1 {
                    type external;
                    peer-as 65328;
                    neighbor 192.0.2.2;
                    inactive: neighbor 192.0.2.3;
                    neighbor 192.0.2.4;
                    inactive: neighbor 192.0.2.5;
                }
                group GROUP2 {
                    type external;
                    peer-as 64901;
                    neighbor 192.0.2.6;
                    neighbor 192.0.2.7;
                    neighbor 192.0.2.8;
                    neighbor 192.0.2.9;
                }
                graceful-restart;
                multipath;
            }
        }
        interface xe-0/0/0.510;
        instance-type virtual-router;
    }
}
