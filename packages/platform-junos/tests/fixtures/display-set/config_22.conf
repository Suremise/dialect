version 14.1R5.4;
groups {
    sp-address-family {
        interfaces {
            <*> {
                unit <*> {
                    family inet6;
                    family mpls;
                }
            }
        }
    }
    static-reject {
        logical-systems {
            <*> {
                routing-instances {
                    <*> {
                        routing-options {
                            rib <*> {
                                static {
                                    route <*> reject;
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    mtu {
        logical-systems {
            <*> {
                interfaces {
                    <ge-*> {
                        unit <*> {
                            family inet {
                                mtu 1500;
                            }
                            family inet6 {
                                mtu 1500;
                            }
                        }
                    }
                }
            }
        }
    }
}
apply-groups mtu;
system {
    host-name vMX01;
    root-authentication {
        encrypted-password "$1$PLACEHOLDER"; ## SECRET-DATA
    }
    login {
        user play {
            uid 9999;
            class super-user;
            authentication {
                encrypted-password "$1$PLACEHOLDER"; ## SECRET-DATA
            }
        }
    }
    services {
        ftp;
        ssh {
            root-login allow;
        }
        telnet;
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
}
