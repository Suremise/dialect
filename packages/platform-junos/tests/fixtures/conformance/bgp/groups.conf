interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 203.0.113.1/32;
            }
        }
    }
}
routing-options {
    router-id 203.0.113.1;
    autonomous-system 65000;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            description "route reflectors";
            local-address 203.0.113.1;
            family inet {
                unicast;
            }
            export NEXT-HOP-SELF;
            neighbor 203.0.113.2;
            neighbor 203.0.113.3 {
                description "second reflector";
            }
        }
        group TRANSIT {
            type external;
            multihop {
                ttl 2;
            }
            family inet {
                unicast;
            }
            family inet6 {
                unicast;
            }
            import [ TRANSIT-IN BOGONS ];
            export TRANSIT-OUT;
            peer-as 64500;
            neighbor 192.0.2.2;
            neighbor 2001:db8::2 {
                import TRANSIT6-IN;
                peer-as 64501;
            }
        }
    }
}
policy-options {
    prefix-list BOGONS {
        10.0.0.0/8;
        192.168.0.0/16;
    }
    policy-statement NEXT-HOP-SELF {
        then {
            next-hop self;
        }
    }
    policy-statement TRANSIT-IN {
        term PREFER {
            then {
                local-preference 80;
            }
        }
    }
    policy-statement BOGONS {
        term DROP {
            from {
                prefix-list BOGONS;
            }
            then {
                reject;
            }
        }
        then {
            accept;
        }
    }
    policy-statement TRANSIT-OUT {
        term LOCAL {
            from {
                protocol [ direct static ];
            }
            then {
                accept;
            }
        }
        term REST {
            then {
                reject;
            }
        }
    }
    policy-statement TRANSIT6-IN {
        from {
            family inet6;
        }
        then {
            as-path-prepend "65000 65000";
            accept;
        }
    }
}
routing-instances {
    CUST {
        instance-type vrf;
        route-distinguisher 65000:1;
        vrf-target target:65000:1;
        routing-options {
            autonomous-system 65000;
        }
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 64512;
                    neighbor 198.51.100.2;
                }
            }
        }
    }
}
