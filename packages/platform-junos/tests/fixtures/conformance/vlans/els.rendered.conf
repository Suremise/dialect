chassis {
    aggregated-devices {
        ethernet {
            device-count 1;
        }
    }
}
interfaces {
    ge-0/0/10 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    ge-0/0/11 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members users;
                }
            }
        }
    }
    ge-0/0/0 {
        description "access port, Junos's default mode";
        unit 0 {
            family ethernet-switching {
                vlan {
                    members voice;
                }
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members voice;
                }
            }
        }
    }
    xe-0/0/0 {
        description "trunk with a native VLAN";
        native-vlan-id 99;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ users voice 30-40 native ];
                }
            }
        }
    }
    xe-0/0/1 {
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members all;
                }
            }
        }
    }
    ae0 {
        unit 0 {
            family ethernet-switching;
        }
    }
    irb {
        unit 10 {
            family inet {
                address 192.0.2.1/24;
            }
        }
        unit 20 {
            family inet {
                address 198.51.100.1/24;
            }
            family inet6 {
                address 2001:db8:20::1/64;
            }
        }
    }
}
vlans {
    users {
        description "user ports";
        vlan-id 10;
        l3-interface irb.10;
    }
    voice {
        vlan-id 20;
        l3-interface irb.20;
    }
    native {
        vlan-id 99;
    }
}
