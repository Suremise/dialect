policy-options {
    policy-statement FROM-PEERS {
        term TRANSIT {
            from {
                as-path-group TRANSITS;
            }
            then {
                local-preference 50;
                accept;
            }
        }
        term DIRECT {
            from {
                as-path DIRECT;
            }
            then {
                accept;
            }
        }
    }
    as-path-group TRANSITS {
        as-path TRANSITS-1 "^64501 .*";
        as-path TRANSITS-2 "^64502 .*";
    }
    as-path DIRECT "^64500$";
}
