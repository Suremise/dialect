routing-options {
    autonomous-system 65000;
}
protocols {
    bgp {
        group EBGP {
            type external;
            import [ IN-FILTER IN-PREFER ];
            export OUT;
            peer-as 64500;
            neighbor 192.0.2.2;
        }
    }
}
policy-options {
    prefix-list CUSTOMERS {
        198.51.100.0/24;
        203.0.113.0/24;
        2001:db8:100::/48;
    }
    prefix-list MARTIANS {
        0.0.0.0/8;
        127.0.0.0/8;
    }
    policy-statement IN-FILTER {
        term MARTIANS {
            from {
                prefix-list-filter MARTIANS orlonger;
            }
            then {
                reject;
            }
        }
        term DEFAULT {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then {
                reject;
            }
        }
        term TOO-LONG {
            from {
                route-filter 0.0.0.0/0 prefix-length-range /25-/32;
                route-filter ::/0 prefix-length-range /49-/128;
            }
            then {
                reject;
            }
        }
        term NEXT {
            then {
                next policy;
            }
        }
    }
    policy-statement IN-PREFER {
        term CUSTOMERS {
            from {
                prefix-list CUSTOMERS;
                community CUSTOMER;
            }
            then {
                community delete INTERNAL;
                local-preference 200;
                accept;
            }
        }
        term PEERS {
            from {
                route-filter 10.0.0.0/8 upto /24;
                as-path VIA-PEER;
                neighbor 192.0.2.2;
            }
            then {
                community add PEER;
                metric 50;
                tag 100;
                next term;
            }
        }
        term TAGGED {
            from {
                tag 100;
                family inet;
            }
            then {
                local-preference 120;
            }
        }
        from {
            protocol bgp;
        }
        then {
            accept;
        }
    }
    policy-statement OUT {
        term LOCAL {
            from {
                protocol [ direct static aggregate ];
            }
            then {
                community set CUSTOMER;
                as-path-prepend "65000 65000";
                next-hop self;
                accept;
            }
        }
        term V6 {
            from {
                family inet6;
            }
            then {
                next-hop 2001:db8::1;
                accept;
            }
        }
        then {
            reject;
        }
    }
    community CUSTOMER members 65000:100;
    community INTERNAL members "^65000:9[0-9]$";
    community PEER members [ 65000:200 target:4200000000L:7 large:65000:1:2 ];
    as-path VIA-PEER ".* 64500 .*";
}
