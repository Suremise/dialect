system {
    ntp {
        server 192.0.2.10;
        server 192.0.2.11 version 4 prefer;
        server ntp.example.net routing-instance mgmt_junos;
        server 192.0.2.12 key 1;
        authentication-key 1 type md5 value "$9$PLACEHOLDER"; ## SECRET-DATA
        source-address 192.0.2.1;
    }
}
