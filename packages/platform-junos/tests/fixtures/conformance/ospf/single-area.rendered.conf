interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 198.51.100.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 203.0.113.1/32;
            }
        }
    }
}
routing-options {
    router-id 203.0.113.1;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                metric 10;
                interface-type p2p;
                hello-interval 5;
                dead-interval 20;
            }
            interface ge-0/0/1.0 {
                passive;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
