chassis {
    aggregated-devices {
        ethernet {
            device-count 2;
        }
    }
}
interfaces {
    xe-0/1/1 {
        ether-options {
            802.3ad ae0;
        }
    }
    xe-0/1/0 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/0 {
        description "to core-1";
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        description "uplink bundle";
        aggregated-ether-options {
            lacp {
                active;
            }
            minimum-links 2;
        }
        unit 0 {
            family inet {
                address 192.0.2.1/31;
            }
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                passive;
            }
        }
    }
}
