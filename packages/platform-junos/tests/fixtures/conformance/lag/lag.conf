groups {
    LAG-MEMBER {
        interfaces {
            <xe-*> {
                ether-options {
                    802.3ad ae1;
                }
            }
        }
    }
}
chassis {
    aggregated-devices {
        ethernet {
            device-count 4;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "to core-1";
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        gigether-options {
            802.3ad {
                ae0;
                primary;
            }
        }
    }
    xe-0/1/0 {
        apply-groups LAG-MEMBER;
    }
    xe-0/1/1 {
        apply-groups LAG-MEMBER;
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        description "uplink bundle";
        aggregated-ether-options {
            minimum-links 2;
            link-speed 10g;
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family inet {
                address 192.0.2.1/31;
            }
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                passive;
            }
        }
    }
}
