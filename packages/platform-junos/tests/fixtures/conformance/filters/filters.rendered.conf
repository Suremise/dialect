interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                filter {
                    input EDGE-IN;
                    output EDGE-OUT;
                }
                address 192.0.2.1/24;
            }
            family inet6 {
                filter {
                    input EDGE6-IN;
                }
                address 2001:db8::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
                address 203.0.113.1/32;
            }
        }
    }
}
policy-options {
    prefix-list MGMT {
        198.51.100.0/24;
    }
    prefix-list BGP-PEERS {
        192.0.2.2/32;
        2001:db8::2/128;
    }
}
firewall {
    family inet {
        filter EDGE-IN {
            term BOGONS {
                from {
                    source-address [ 0.0.0.0/8 10.0.0.0/8 127.0.0.0/8 ];
                }
                then {
                    count BOGONS;
                    discard;
                }
            }
            term WEB {
                from {
                    destination-address 192.0.2.10;
                    protocol tcp;
                    destination-port [ 80 443 ];
                }
                then {
                    accept;
                }
            }
            term RETURN {
                from {
                    protocol tcp;
                    tcp-established;
                }
                then {
                    accept;
                }
            }
            term PING {
                from {
                    protocol icmp;
                    icmp-type [ 0 8 ];
                    icmp-code 0;
                }
                then {
                    accept;
                }
            }
            term FRAGMENTS {
                from {
                    is-fragment;
                }
                then {
                    log;
                    reject;
                }
            }
            term LOG-REST {
                then {
                    log;
                    next term;
                }
            }
            term REST {
                then {
                    discard;
                }
            }
        }
        filter EDGE-OUT {
            term VOICE {
                from {
                    dscp [ 46 34 ];
                }
                then {
                    count VOICE;
                    accept;
                }
            }
            term ALL {
                then {
                    accept;
                }
            }
        }
        filter PROTECT-RE {
            term SSH {
                from {
                    source-prefix-list MGMT;
                    protocol tcp;
                    destination-port 22;
                }
                then {
                    accept;
                }
            }
            term BGP {
                from {
                    source-prefix-list BGP-PEERS;
                    protocol tcp;
                    port 179;
                }
                then {
                    accept;
                }
            }
            term SYN-FLOOD {
                from {
                    protocol tcp;
                    tcp-flags "syn & !ack";
                    first-fragment;
                }
                then {
                    count SYN;
                    next term;
                }
            }
            term NTP {
                from {
                    address 198.51.100.123;
                    protocol udp;
                    source-port 123;
                    destination-port 1024-65535;
                }
                then {
                    accept;
                }
            }
        }
    }
    family inet6 {
        filter EDGE6-IN {
            term ND {
                from {
                    next-header icmp6;
                    icmp-type [ 133 134 135 136 ];
                }
                then {
                    accept;
                }
            }
            term BGP {
                from {
                    source-prefix-list BGP-PEERS;
                    next-header tcp;
                    destination-port 179;
                }
                then {
                    accept;
                }
            }
            term MARKED {
                from {
                    destination-address 2001:db8:100::/48;
                    traffic-class 46;
                }
                then {
                    accept;
                }
            }
        }
    }
}
