groups {
    COMMON {
        system {
            domain-name example.net;
            ntp {
                server 192.0.2.10;
            }
        }
        interfaces {
            <ge-*> {
                mtu 9192;
                unit <*> {
                    family inet {
                        mtu 9000;
                    }
                }
            }
        }
    }
    LOCAL {
        system {
            domain-name local.example.net;
        }
    }
    DESCRIBED {
        interfaces {
            <*> {
                description "from a group";
            }
        }
    }
    UNUSED {
        system {
            host-name never;
        }
    }
}
apply-groups [ LOCAL COMMON ];
system {
    host-name groups-1;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.1/24;
            }
        }
    }
    ge-0/0/1 {
        apply-groups-except COMMON;
        unit 0 {
            family inet {
                address 192.0.2.5/30;
            }
        }
    }
    xe-0/0/0 {
        apply-groups DESCRIBED;
        mtu 1514;
    }
}
