system {
    host-name groups-1;
    domain-name local.example.net;
    ntp {
        server 192.0.2.10;
    }
}
interfaces {
    ge-0/0/0 {
        mtu 9192;
        unit 0 {
            family inet {
                mtu 9000;
                address 192.0.2.1/24;
            }
        }
    }
    xe-0/0/0 {
        description "from a group";
        mtu 1514;
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 192.0.2.5/30;
            }
        }
    }
}
