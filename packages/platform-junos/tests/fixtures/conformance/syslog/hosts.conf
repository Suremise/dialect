system {
    syslog {
        host 192.0.2.20 {
            any notice;
            facility-override local7;
            port 1514;
        }
        host 192.0.2.21 {
            any any;
            routing-instance mgmt_junos;
            transport udp;
        }
        host 192.0.2.22 {
            any info;
            authorization none;
        }
        host syslog.example.net;
        file messages {
            any notice;
        }
    }
}
