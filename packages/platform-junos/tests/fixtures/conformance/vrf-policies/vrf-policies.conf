policy-options {
    policy-statement RED-IN {
        term TARGETS {
            from {
                community [ RED HUB ];
            }
            then {
                accept;
            }
        }
        then {
            reject;
        }
    }
    policy-statement RED-OUT {
        term LOCAL {
            from {
                protocol [ direct static ];
            }
            then {
                community add RED;
                accept;
            }
        }
        then {
            reject;
        }
    }
    policy-statement BLUE-IN {
        term HUB {
            from {
                community HUB;
            }
            then {
                local-preference 200;
                next policy;
            }
        }
    }
    community RED members target:65000:1;
    community HUB members target:65000:100;
}
routing-instances {
    RED {
        instance-type vrf;
        route-distinguisher 65000:1;
        vrf-import RED-IN;
        vrf-export RED-OUT;
    }
    BLUE {
        instance-type vrf;
        route-distinguisher 65000:2;
        vrf-import [ BLUE-IN RED-IN ];
        vrf-target target:65000:2;
    }
}
