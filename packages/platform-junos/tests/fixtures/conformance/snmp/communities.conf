snmp {
    location "rack 7, row B";
    contact noc@example.net;
    community PLACEHOLDER-RO {
        authorization read-only;
        clients {
            192.0.2.0/24;
            2001:db8::/32;
        }
    }
    community PLACEHOLDER-RW {
        authorization read-write;
    }
    community PLACEHOLDER-LISTED {
        authorization read-only;
        client-list-name MGMT;
    }
    community PLACEHOLDER-EXCLUDED {
        clients {
            192.0.2.0/24;
            192.0.2.128/25 restrict;
        }
    }
    trap-group ops {
        targets 192.0.2.30;
    }
}
