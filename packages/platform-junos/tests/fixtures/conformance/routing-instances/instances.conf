groups {
    CUST-B-UNITS {
        routing-instances {
            CUST-B {
                interface ge-0/0/2.0;
            }
        }
    }
}
apply-groups CUST-B-UNITS;
interfaces {
    ge-0/0/1 {
        vlan-tagging;
        unit 10 {
            vlan-id 10;
            family inet {
                address 198.51.100.1/30;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 203.0.113.1/30;
            }
        }
    }
    lo0 {
        unit 1 {
            family inet {
                address 192.0.2.101/32;
            }
        }
    }
}
routing-instances {
    CUST-A {
        instance-type vrf;
        interface ge-0/0/1.10;
        interface lo0.1;
        route-distinguisher 65000:100;
        vrf-target target:65000:100;
    }
    CUST-B {
        instance-type vrf;
        route-distinguisher 192.0.2.1:200;
        vrf-target {
            import target:65000:201;
            export target:65000:202;
        }
    }
    CUST-C {
        instance-type vrf;
        route-distinguisher 4200000000L:300;
        vrf-target target:4200000000L:300;
    }
    TRANSIT {
        instance-type virtual-router;
        interface ge-0/0/3.0;
    }
}
