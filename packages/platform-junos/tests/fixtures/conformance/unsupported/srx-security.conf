system {
    host-name srx-1;
}
security {
    zones {
        security-zone trust {
            interfaces {
                ge-0/0/1.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
    nat {
        source {
            rule-set out {
                from zone trust;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0;
        }
    }
}
