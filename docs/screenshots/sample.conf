system {
    host-name edge-1;
    domain-name example.net;
    name-server {
        192.0.2.53;
    }
    ntp {
        server 192.0.2.123;
    }
}
interfaces {
    ge-0/0/0 {
        description "uplink to core";
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ge-0/0/1 {
        vlan-tagging;
        unit 10 {
            description "site A";
            vlan-id 10;
            family inet {
                address 198.51.100.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 203.0.113.1/32;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 192.0.2.2;
    }
}
