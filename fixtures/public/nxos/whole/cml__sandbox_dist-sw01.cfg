rmon event 1 log trap public description FATAL(1) owner PMON@FATAL
rmon event 2 log trap public description CRITICAL(2) owner PMON@CRITICAL
rmon event 3 log trap public description ERROR(3) owner PMON@ERROR
rmon event 4 log trap public description WARNING(4) owner PMON@WARNING
rmon event 5 log trap public description INFORMATION(5) owner PMON@INFO

vlan 1,101-105
vlan 101
  name prod
vlan 102
  name dev
vlan 103
  name test
vlan 104
  name security
vlan 105
  name iot

vrf context management
  ip route 0.0.0.0/0 10.10.20.254
hardware forwarding unicast trace
vpc domain 101
  peer-switch
  peer-keepalive destination 10.10.20.178 source 10.10.20.177
  peer-gateway


interface Vlan1
  no ip redirects
  no ipv6 redirects

interface Vlan101
  description prod svi
  no shutdown
  no ip redirects
  ip address 172.16.101.2/24
  no ipv6 redirects
  ip router ospf 1 area 0.0.0.0
  hsrp 10
    ip 172.16.101.1

interface Vlan102
  description dev svi
  no shutdown
  no ip redirects
  ip address 172.16.102.2/24
  no ipv6 redirects
  ip router ospf 1 area 0.0.0.0
  hsrp 10
    ip 172.16.102.1

interface Vlan103
  description test svi
  no shutdown
  no ip redirects
  ip address 172.16.103.2/24
  no ipv6 redirects
  ip router ospf 1 area 0.0.0.0
  hsrp 10
    ip 172.16.103.1

interface Vlan104
  description security svi
  no shutdown
  no ip redirects
  ip address 172.16.104.2/24
  no ipv6 redirects
  ip router ospf 1 area 0.0.0.0
  hsrp 10
    ip 172.16.104.1

interface Vlan105
  description iot svi
  no shutdown
  no ip redirects
  ip address 172.16.105.2/24
  no ipv6 redirects
  ip router ospf 1 area 0.0.0.0
  hsrp 10
    ip 172.16.105.1

interface port-channel1
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/1
  description VPC Peer Link
  switchport mode trunk
  channel-group 1 mode active

interface Ethernet1/2
  description VPC Peer Link
  switchport mode trunk
  channel-group 1 mode active

interface Ethernet1/3
  description L3 link to dist-rtr01
  no switchport
  ip address 172.16.252.1/30
  no ip ospf passive-interface
  ip router ospf 1 area 0.0.0.0
  no shutdown

interface Ethernet1/4
  description L3 link to dist-rtr02
  no switchport
  ip address 172.16.252.5/30
  no ip ospf passive-interface
  ip router ospf 1 area 0.0.0.0
  no shutdown

interface Ethernet1/5
  description to
  shutdown

interface Ethernet1/6
  description to
  shutdown

interface Ethernet1/7
  description to
  shutdown

interface Ethernet1/8
  description to
  shutdown

interface Ethernet1/9
  description to
  shutdown

interface Ethernet1/10
  description to
  shutdown

interface Ethernet1/11
  description Link to inside-host01
  switchport access vlan 101
  spanning-tree port type edge

interface mgmt0
  description to port8.sandbox-backend
  duplex full
  vrf member management
  ip address 10.10.20.177/24

interface loopback0
  description to
  shutdown
line console
  exec-timeout 0
  terminal width  511
line vty
router ospf 1
  passive-interface default

no logging console
boot nxos bootflash:///nxos.9.2.3.bin