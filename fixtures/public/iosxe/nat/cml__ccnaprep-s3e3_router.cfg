hostname router
ip domain name ccnaprep.internal
ip domain list ccnaprep.internal
!
ip name-server 192.168.255.1
!
! In order to avoid entering a configuration dialog
! on boot, please ensure that all ethernet interfaces
! have some ip configuration present here such as the
! example below:
!
interface range Ethernet 0/0 - 3
 no ip address
 shutdown
!
! EEM Applet to add SSH Key Automatically
event manager applet do-ssh authorization bypass
 event timer cron cron-entry "@reboot" maxrun 130
action 01 wait 10
action 02 cli command "enable"
action 11 cli command "crypto key generate rsa modulus 2048"
action 20 cli command "config t"
action 21 cli command "no event manager applet do-ssh"
action 22 cli command "end"
action 23 cli command "write mem"
!
enable secret cisco
username cisco privilege 15 secret cisco
!
! Reduce logging level on console to quiet noise
logging console notifications
!
line vty 0 4
 transport input ssh
 login local
 exit
!
!
interface eth0/0
 desc link to Services Network
 ip address 172.16.0.1 255.255.255.0
 no shut
 exit
!
interface eth0/1
 desc link to Clients Network
 ip address 192.168.0.1 255.255.255.0
 no shut
 ip nat inside
 exit
!
interface eth0/2
 desc link to Simulated Internet
 ip address 192.0.2.1 255.255.255.0
 no shut
 exit
!
interface eth0/3
 desc link to Public Internet for Node Setup
 ip address dhcp
 no shut
 ip nat outside
 exit
!
ip access-list standard SETUP-NAT
 permit 192.168.0.0 0.0.0.255
!
ip nat inside source list SETUP-NAT interface eth0/3 overload
!
snmp-server community CCNAPREP RO
!
ntp master 5
ntp server 10.1.1.1
! NTP server 10.1.1.1 is from the Cisco U internal lab.
! You can change to your own NTP server or a public
! server such as pool.ntp.org or time.nist.gov
!
end