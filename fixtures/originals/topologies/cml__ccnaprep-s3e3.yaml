    ## Setup and Scenario
    This set of lab based demonstrations include a small network made up of "Clients", "Services", and "Simulated Internet" network locations connected by a router. There are 2 client hosts, an internal web server hosting 2 web sites, and a simulated internet with 3 web sites.

    The internal web sites are:
    * `http://server` - A network management application
    * `http://adminserver:8080` - A system dashboard and management application (*Note: This site is available on port `8080`.)

    The simulated internet web sites are:
    * `http://internet100` - A streaming site
    * `http://internet200` - An online game
    * `http://internet210` - Landing page for a new AAI company

    Each lab exercise will have you leverage access control lists, primarily extended access control lists, to enforce some policy.

    > Note: The credentials for all devices and hosts are `cisco / cisco`.

    *Be sure to **START** the lab before continuing to the demo labs.*

