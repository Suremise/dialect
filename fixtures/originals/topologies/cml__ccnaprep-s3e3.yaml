          <body>
              <div class="container">
                  <h1>🐍 CYBER SNAKE 2000 🐍</h1>
                  <div class="subtitle">
                      <span class="blink">★</span> The ULTIMATE Retro Gaming Experience <span class="blink">★</span>
                  </div>

