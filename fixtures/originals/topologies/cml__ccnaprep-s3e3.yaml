          </head>
          <body>
              <div class="container">
                  <!-- Login Screen -->
                  <div class="login-container" id="loginScreen">
                      <div class="login-header">
                          <div class="server-icon">🔐</div>
                          <h1>AdminServer</h1>
                          <p>System Control Panel</p>
                      </div>

                      <div class="error-message" id="errorMessage">
                          Invalid credentials. Please try again.
                      </div>

                      <form id="loginForm" onsubmit="return handleLogin(event)">
                          <div class="form-group">
                              <label for="username">Username</label>
                              <input type="text" id="username" name="username" required autocomplete="username">
                          </div>

                          <div class="form-group">
                              <label for="password">Password</label>
                              <input type="password" id="password" name="password" required autocomplete="current-password">
                          </div>

                          <button type="submit" class="login-btn">Sign In</button>

                          <p class="hint-text">Hint: Default credentials are cisco/cisco</p>
                      </form>
                  </div>

                  <!-- Admin Dashboard -->
                  <div class="dashboard" id="dashboard">
                      <div class="dashboard-header">
                          <button class="logout-btn" onclick="handleLogout()">Logout</button>
                          <h1>System Dashboard</h1>
                          <p>Welcome back, Administrator</p>
                      </div>

                      <div class="stats-grid">
                          <div class="stat-card green">
                              <div class="stat-icon">✓</div>
                              <div class="stat-label">System Status</div>
                              <div class="stat-value">Online</div>
                          </div>

                          <div class="stat-card blue">
                              <div class="stat-icon">👥</div>
                              <div class="stat-label">Active Users</div>
                              <div class="stat-value" id="activeUsers">247</div>
                          </div>

                          <div class="stat-card orange">
                              <div class="stat-icon">📊</div>
                              <div class="stat-label">CPU Usage</div>
                              <div class="stat-value" id="cpuUsage">34%</div>
                          </div>

                          <div class="stat-card purple">
                              <div class="stat-icon">💾</div>
                              <div class="stat-label">Memory</div>
                              <div class="stat-value" id="memoryUsage">6.2GB</div>
                          </div>
                      </div>

                      <div class="control-panel">
                          <h2>Quick Actions</h2>
                          <div class="button-grid">
                              <button class="control-btn primary" onclick="performAction('restart', 'Initiating system restart...')">
                                  🔄 Restart Services
                              </button>
                              <button class="control-btn success" onclick="performAction('backup', 'Starting backup process...')">
                                  💾 Run Backup
                              </button>
                              <button class="control-btn warning" onclick="performAction('update', 'Checking for updates...')">
                                  ⚡ Update System
                              </button>
                              <button class="control-btn danger" onclick="performAction('clear', 'Clearing cache...')">
                                  🗑️ Clear Cache
                              </button>
                              <button class="control-btn primary" onclick="performAction('scan', 'Running security scan...')">
                                  🔍 Security Scan
                              </button>
                              <button class="control-btn success" onclick="performAction('optimize', 'Optimizing database...')">
                                  ⚙️ Optimize DB
                              </button>
                          </div>
                      </div>

                      <div class="server-log">
                          <h2>System Log</h2>
                          <div class="log-container" id="logContainer">
                              <div class="log-entry info">
                                  <span class="timestamp">[2025-11-16 10:23:45]</span> System initialized successfully
                              </div>
                              <div class="log-entry success">
                                  <span class="timestamp">[2025-11-16 10:24:12]</span> All services running normally
                              </div>
                              <div class="log-entry info">
                                  <span class="timestamp">[2025-11-16 10:25:03]</span> Database connection established
                              </div>
                              <div class="log-entry warning">
                                  <span class="timestamp">[2025-11-16 10:26:47]</span> High memory usage detected on worker-03
                              </div>
                              <div class="log-entry success">
                                  <span class="timestamp">[2025-11-16 10:27:15]</span> Backup completed successfully
                              </div>
                          </div>
                      </div>
                  </div>
              </div>

              <script>
                  function handleLogin(event) {
                      event.preventDefault();

                      const username = document.getElementById('username').value;
                      const password = document.getElementById('password').value;
                      const errorMessage = document.getElementById('errorMessage');

                      // Check credentials
                      if (username === 'cisco' && password === 'cisco') {
                          // Successful login
                          errorMessage.style.display = 'none';
                          document.getElementById('loginScreen').style.display = 'none';
                          document.getElementById('dashboard').style.display = 'block';

                          // Add login log entry
                          addLogEntry('success', 'Administrator logged in successfully');

                          // Start updating stats
                          startStatsUpdates();
                      } else {
                          // Failed login
                          errorMessage.style.display = 'block';
                          document.getElementById('password').value = '';

                          // Shake animation
                          errorMessage.style.animation = 'shake 0.5s';
                          setTimeout(() => {
                              errorMessage.style.animation = '';
                          }, 500);
                      }

                      return false;
                  }

                  function handleLogout() {
                      addLogEntry('info', 'Administrator logged out');

                      setTimeout(() => {
                          document.getElementById('dashboard').style.display = 'none';
                          document.getElementById('loginScreen').style.display = 'block';
                          document.getElementById('username').value = '';
                          document.getElementById('password').value = '';
                          document.getElementById('errorMessage').style.display = 'none';

                          // Stop stats updates
                          if (window.statsInterval) {
                              clearInterval(window.statsInterval);
                          }
                      }, 300);
                  }

                  function performAction(action, message) {
                      const actionMessages = {
                          'restart': ['Stopping services...', 'Restarting services...', 'Services restarted successfully'],
                          'backup': ['Creating backup snapshot...', 'Compressing data...', 'Backup completed successfully'],
                          'update': ['Downloading updates...', 'Installing updates...', 'System updated successfully'],
                          'clear': ['Clearing cache...', 'Cleaning temporary files...', 'Cache cleared successfully'],
                          'scan': ['Initiating security scan...', 'Scanning for vulnerabilities...', 'No threats detected'],
                          'optimize': ['Analyzing database...', 'Optimizing tables...', 'Database optimized successfully']
                      };

                      const messages = actionMessages[action];
                      let index = 0;

                      addLogEntry('info', messages[0]);

                      const interval = setInterval(() => {
                          index++;
                          if (index < messages.length) {
                              addLogEntry(index === messages.length - 1 ? 'success' : 'info', messages[index]);
                          } else {
                              clearInterval(interval);
                          }
                      }, 1500);
                  }

                  function addLogEntry(type, message) {
                      const logContainer = document.getElementById('logContainer');
                      const timestamp = new Date().toLocaleString('en-US', {
                          year: 'numeric',
                          month: '2-digit',
                          day: '2-digit',
                          hour: '2-digit',
                          minute: '2-digit',
                          second: '2-digit',
                          hour12: false
                      }).replace(',', '');

                      const entry = document.createElement('div');
                      entry.className = `log-entry ${type}`;
                      entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;

                      logContainer.appendChild(entry);
                      logContainer.scrollTop = logContainer.scrollHeight;

                      // Keep only last 50 entries
                      while (logContainer.children.length > 50) {
                          logContainer.removeChild(logContainer.firstChild);
                      }
                  }

                  function startStatsUpdates() {
                      // Update stats every 3 seconds
                      window.statsInterval = setInterval(() => {
                          // Update active users (random between 200-300)
                          const users = Math.floor(Math.random() * 100) + 200;
                          document.getElementById('activeUsers').textContent = users;

                          // Update CPU usage (random between 20-80%)
                          const cpu = Math.floor(Math.random() * 60) + 20;
                          document.getElementById('cpuUsage').textContent = cpu + '%';

                          // Update memory (random between 4-8 GB)
                          const memory = (Math.random() * 4 + 4).toFixed(1);
                          document.getElementById('memoryUsage').textContent = memory + 'GB';

                          // Occasionally add random log entries
                          if (Math.random() > 0.7) {
                              const randomLogs = [
                                  { type: 'info', msg: 'Health check passed for all nodes' },
                                  { type: 'success', msg: 'SSL certificate renewed successfully' },
                                  { type: 'info', msg: 'New user session created' },
                                  { type: 'warning', msg: 'API rate limit approaching threshold' },
                                  { type: 'success', msg: 'Automated backup completed' }
                              ];
                              const log = randomLogs[Math.floor(Math.random() * randomLogs.length)];
                              addLogEntry(log.type, log.msg);
                          }
                      }, 3000);
                  }

                  // Add shake animation to CSS
                  const style = document.createElement('style');
                  style.textContent = `
                      @keyframes shake {
                          0%, 100% { transform: translateX(0); }
                          25% { transform: translateX(-10px); }
                          75% { transform: translateX(10px); }
                      }
                  `;
                  document.head.appendChild(style);
              </script>
          </body>
          </html>
          EOF

          # Restart nginx server to apply changes
          nginx -s reload

          # keep the next line to indicate that the machine is ready
          echo "READY" >/dev/console
          exit 0
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n4
    image_definition: null
    label: server
    node_definition: nginx
    parameters: {}
    ram: null
    tags: []
    x: 320
    y: 240
    interfaces:
      - id: i0
        label: eth0
        mac_address: null
        type: physical
        slot: 0
  - boot_disk_size: null
    configuration:
      - name: boot.sh
        content: |-
          # Insert more commands here
          ip address add dev eth0 192.0.2.100/24
          ip address add dev eth0 192.0.2.200/24
          ip address add dev eth0 192.0.2.210/24
          ip link set dev eth0 up
          ip route add default via 192.0.2.1

          #

          # Create the customized nginx.conf to serve multiple pages
          cat > /etc/nginx/nginx.conf << 'EOF'

          user  nginx;
          worker_processes  auto;

          error_log  /var/log/nginx/error.log notice;
          pid        /run/nginx.pid;


          events {
              worker_connections  1024;
          }


          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;

              log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for"';

              access_log  /var/log/nginx/access.log  main;

              sendfile        on;
              #tcp_nopush     on;

              keepalive_timeout  65;

              #gzip  on;

              # Default server - catches unmatched requests
              server {
                  listen 80 default_server;
                  server_name _;

                  location / {
                      root /usr/share/nginx/html;
                      index index.html;
                  }
              }

              # Internet100 - Quantum Cloud Streaming
              server {
                  listen 80;
                  server_name internet100;

                  location / {
                      root /usr/share/nginx/html;
                      try_files /internet100.html =404;
                  }
              }

              # Internet200 - CYBER SNAKE 2000
              server {
                  listen 80;
                  server_name internet200;

                  location / {
                      root /usr/share/nginx/html;
                      try_files /internet200.html =404;
                  }
              }

              # Internet210 - AAI Solutions
              server {
                  listen 80;
                  server_name internet210;

                  location / {
                      root /usr/share/nginx/html;
                      try_files /internet210.html =404;
                  }
              }
          }
