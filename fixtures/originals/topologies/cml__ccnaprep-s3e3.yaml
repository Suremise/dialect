    ## Lab 3: Generate Syslog Messages for All HTTP Traffic to Internet210

    In this lab, we will handle a request from the security team to gather details on all web traffic from the inside network to the website `http://internet210`.  It seems there is concern that this web provider might be malicious and the cybersecurity team wants to understand what systems and users are using the service. There is no interest in blocking or preventing access to the server at this time, simply to monitor. They have asked to generate syslog messages that can be analyzed later.

    This is an interesting use case that does indeed come up in production networks fairly regularly, the desire to "log" hits to a specific ACE in an access list.  Thankfully there is a very easy way to enable option the to fullfill this requirement.

    But first, where to apply this new policy?  Normally an extended ACL would be applied close to the source, but there is no specific source for this policy. We could apply the policy/ACL on ALL interfaces on `router`, but that seems inefficient and prone to error.  In this case, applying it outbound on the interface connected to the destination is the most efficient option.

    So let's plan what we need to do for this ACL.

    * Create a new extended ACL that will be applied outbound on `eth0/2`
    * We need to `permit` and `log` web traffic to internet210
    * We will need to also `permit any` at the end of the ACL to avoid blocking all traffic with the implicit deny at the end

    ### Creating the ACL

    Here is the fairly simple ACL we will need to create. It doesn't actually block/deny any traffic.  But not all ACLs will, sometimes we want to simply "match" traffic to take some action on it.

    ```
    ip access-list extended TO-SIMULATED-INTERNET
        permit tcp any host 192.0.2.210 eq www log
        permit ip any any
    ```

    > Note: There is also a `log-input` variation that you could try and compare the results.

    Check the ACL configuration to make sure it matches what you expect.

    ```
    show ip access-list TO-SIMULATED-INTERNET
    ```

    ### Applying the ACL

    Go ahead and apply this ACL outbound on the interface

    ```
    interface eth0/2
        ip access-group TO-SIMULATED-INTERNET out
    ```

    ### Testing the ACL

    From both clients navigate to `http://internet210`.  You should have no problems accessing the site.

    Now return to the console of `router` and lets check the results.

    First, we'll look at the counters like we have before.

    ```
    show ip access-list TO-SIMULATED-INTERNET

    Extended IP access list TO-SIMULATED-INTERNET
        10 permit tcp any host 192.0.2.210 eq www log (38 matches)
        20 permit ip any any (41 matches)
    ```

    You should see matches on the ACE for `internet210`.  Matches on the `ip any any` will be due to background traffic on the network and are normal.

    Now, let's check for the log messages.  We don't have a syslog server setup in this lab, so we will check the log buffer.

    ```
    show logging last 5
    ```

    > Tip: The log buffer on a network device can be quite long. Use `last #` to limit the output to the most recent number of messages.

    Scroll past the logging output heading section and you should see messages that look like these.

    ```
    .Nov 18 02:14:47.898: %SEC-6-IPACCESSLOGP: list TO-SIMULATED-INTERNET permitted tcp 192.168.0.17(58020) -> 192.0.2.210(80), 1 packet
    .Nov 18 02:15:44.009: %SEC-6-IPACCESSLOGP: list TO-SIMULATED-INTERNET permitted tcp 192.168.0.33(38434) -> 192.0.2.210(80), 1 packet
    .Nov 18 02:20:05.284: %SEC-6-IPACCESSLOGP: list TO-SIMULATED-INTERNET permitted tcp 192.168.0.17(58020) -> 192.0.2.210(80), 17 packets
    ```

    These messages are generated by hits to the ACL.  Notice that some of the messages might be for several packets. The router does this to avoid overloading the CPU and impacting performance.

    What severity level was this message sent at?

    .

    .

    .

    If you said "Informational - 6" you were correct ⭐️.

    > The `router` was configured to only show "Notification - 5" messages or higher (lower number value) at the console to cut down on noise from other "informational" messages. Otherwise we would have seen these syslog messages about the ACL hits without needing to look at the log buffer.

    ## Lab 4: Creative Wildcard Matching
    ### Techincal Tagent... The "Wild" in Wildcard Masks

    The vast majority of security policies or traffic matching asks that come to network engineers involve matching a specific host, a specific network, or a range of networks.  Each of these can be done with fairly straightforward wildcard masks that might look like `0.0.0.255`, `0.0.127.255`, or `0.3.255.255.`.

    However, wildcard masks could also look like `0.255.0.0`, `0.0.64.0`, or even something truly *wild* like `3.148.4.34`.  That's because like subnet masks, a wildcard mask is actually a binary representation of 0s and 1s that are used to identify which bits in a network address must match the address in the ACE for it to trigger.

    If every bit in the network address being tested matches the ACE address bit where there is a `0` in the wildcard mask, then it is a match.

    Let's see an example of this in action.

    Consider this standard ACL.

    ```
    access-list 1 permit 192.168.34.0 0.0.0.255
    ```

    I know... it's not very "wild", we'll get to that in a minute...

    Would the address `192.168.34.101` match?  By now you probably already know, "yes, of course it will", but let's do the math to see exactly why.

    ```
    1. First convert the ACL adress and wildcard mask to binary

    192.168.34.0        11000000.10101000.00100010.00000000
    0.0.0.255           00000000.00000000.00000000.11111111

    2. Now convert the address to test to binary

    192.168.34.101      11000000.10101000.00100010.01100101

    3. Now compare the bits in the two addresses where the wildcard bits are 0
       (M = Match, x = no match, - = Not tested)

    Wildcard Mask       00000000.00000000.00000000.11111111
    ACL Address         11000000.10101000.00100010.00000000
    Test Address        11000000.10101000.00100010.01100101
    Result              MMMMMMMM.MMMMMMMM.MMMMMMMM.--------

    4. All *significant* bits in the ACL address and test address match. So this address would trigger this ACL line.
    ```

    With the theory and math understood, let's look at a more interesting case.

    Consider this standard ACL.

    ```
    access-list 2 permit 192.168.34.0 3.148.4.34
    ```

    Which of these addresses would match this ACL?

    * `192.168.34.101`
    * `192.234.15.194`
    * `194.60.34.34`

    Not so easy this time right?  Let's do the math!

    ```
    1. First convert the ACL adress and wildcard mask to binary

    192.168.34.0        11000000.10101000.00100010.00000000
    3.148.4.34          00000011.10010100.00000100.00100010

    2. Now convert the addresses to test to binary

    192.168.34.101      11000000.10101000.00100010.01100101
    192.234.15.194      11000000.11101010.00001111.11000010
    194.60.34.34        11000010.00111100.00100010.00100010

    3. Now compare the bits in each address where the wildcard bits are 0
       (M = Match, x = no match, - = Not tested)

    192.168.34.101

        Wildcard Mask       00000011.10010100.00000100.00100010
        ACL Address         11000000.10101000.00100010.00000000
        192.168.34.101      11000000.10101000.00100010.01100101
        Result              MMMMMM--.-MM-M-MM.MMMMM-MM.Mx-MMx-x     NO-MATCH

    192.234.15.194
        Wildcard Mask       00000011.10010100.00000100.00100010
        ACL Address         11000000.10101000.00100010.00000000
        192.234.15.194      11000000.11101010.00001111.11000010
        Result              MMMMMM--.-xM-M-xM.MMxMx-Mx.xx-MMM-M     NO-MATCH

    194.60.34.34
        Wildcard Mask       00000011.10010100.00000100.00100010
        ACL Address         11000000.10101000.00100010.00000000
        194.60.34.34        11000010.00111100.00100010.00100010
        Result              MMMMMM--.-MM-M-MM.MMMMM-MM.MM-MMM-M     MATCH
    ```

    So address only `194.60.34.34` would match this example ACL... not something easy to see without doing the actual comparison.  And doing it by hand is slow and error prone. Thankfully the hardware and software in network equipment can do this test very fast.

    The reality is that there is rarely a need for an ACL using a wildcard mask as bizare as `3.148.4.34`.  However, there are times when a policy might involve "match the third octet", "match the fourth subnet of the network", or "match all odd addresses".  And in order to efficently create ACLs for these requirements require an understanding of wildcard matching.

    This lab exercise will tackle just such as policy!

    ### Preventing Even IP Addresses from Accessing the Services
    You've been asked to update the extended ACL on the router interface connected to the client network to prevent any even IP address from reaching the Services network. You weren't given a reason for this strange request, just told to make it happen.

    First, we can verify that even IP addresses CAN access the server. This is useful to show that our policy changes actualy had the effect we expected.  Both `client1` and `client2` are configured with a secondary IP address that we can source pings from for this test.

    From `client1`

    ```
    ping -c 3 -I 192.168.0.134 server
    ```

    From `client2`

    ```
    ping -c 3 -I 192.168.0.192 server
    ```

    ### What makes an address "even"?
    If we consider the requirements for this policy

    * Add to the existing ACL already on the interface
    * Prevent even addresses from reaching the Services network - so `deny ip`
    * We'll need a wildcard mask for even addresses

    How do we identify "even addresses" in a mask?  Well let's look at a few "addresses" in binary and see what makes an "even" address vs odd

    ```
    Even addresses
    0.0.0.2             00000000.00000000.00000000.00000010
    192.168.34.10       11000000.10101000.00100010.00001010
    10.11.34.130        00001010.00001011.00100010.10000010

    Odd addresses
    0.0.0.7             00000000.00000000.00000000.00000111
    192.168.34.11       11000000.10101000.00100010.00001011
    10.11.34.129        00001010.00001011.00100010.10000001
    ```

    The difference between an "even" and "odd" address is the final bit. Which if you consider the decimal value of the bit positions, that should make sense.

    ```
    Bit Position    8   7   6   5   4   3   2   1
    Decimal Value   128 64  32  16  8   4   2   1
    ```

    Any binary value where the final bit is `1` will be odd. Binary values with a `0` in the final bit will be even.

    So we need a wildcard mask, and associated address that will ensure that the last bit in an address is a `0`.

    ```
    In Binary
    Wildcard Mask   11111111.11111111.11111111.11111110
    Address         --------.--------.--------.-------0

    In Decimal
    Wildcard Mask   255.255.255.254
    Address         0.0.0.0
    ```

    > The only bit in the address that matters is the final one, so it could be any "even" IP address, but it is typical to use `0` for bits that don't matter.

    ### Updating the ACL
    A lot of planning and exploration to get here, but the time has come to add our new ACE to the ACL.

    ```
    router# show ip access-list FROM-CLIENTS

    Extended IP access list FROM-CLIENTS
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080 (20 matches)
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080 (2 matches)
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www (32 matches)
        100 permit icmp 192.168.0.0 0.0.0.255 192.168.0.0 0.0.0.255 echo
        110 permit icmp 192.168.0.0 0.0.0.255 172.16.0.0 0.0.240.255 echo (13 matches)
        120 permit icmp 192.168.0.0 0.0.0.255 10.0.0.0 0.255.255.255 echo
        130 permit icmp host 192.168.0.17 any echo (3 matches)
        140 deny icmp 192.168.0.0 0.0.0.255 any echo (3 matches)
        1000 permit ip any any (30211 matches)
    ```

    But where should we put it in the list?  The policy is to prevent **ALL** access to the Services network from even addresses, so we want to make sure traffic isn't mistakingly allowed by an earlier line in the ACL.  So to be safe, we'll put it up at the top.

    ```
    ip access-list extended FROM-CLIENTS
        1 deny ip 0.0.0.0 255.255.255.254 172.16.0.0 0.0.0.255
    ```

    It looks a little strange, but that doesn't matter if it works.  Let's find out!

    ### Testing the ACL

    We'll use the same pings tests from the clients as before to check our ACL.  Both of these should show `100% packet loss`.

    From `client1`

    ```
    ping -c 3 -I 192.168.0.134 server
    ```

    From `client2`

    ```
    ping -c 3 -I 192.168.0.192 server
    ```

    Probably good to make sure both clients can still ping the server from their primary IP addresses.

    ```
    ping server
    ```

    Check the counters on the ACL to see if the new ACE matched as expected.

    ```
    router# show ip access-list FROM-CLIENTS

    Extended IP access list FROM-CLIENTS
        1 deny ip 0.0.0.0 255.255.255.254 172.16.0.0 0.0.0.255 (6 matches)
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080 (20 matches)
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080 (2 matches)
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www (32 matches)
        100 permit icmp 192.168.0.0 0.0.0.255 192.168.0.0 0.0.0.255 echo
        110 permit icmp 192.168.0.0 0.0.0.255 172.16.0.0 0.0.240.255 echo (14 matches)
        120 permit icmp 192.168.0.0 0.0.0.255 10.0.0.0 0.255.255.255 echo
        130 permit icmp host 192.168.0.17 any echo (3 matches)
        140 deny icmp 192.168.0.0 0.0.0.255 any echo (3 matches)
        1000 permit ip any any (30367 matches)
    ```

    Before finishing the testing, feel free to check that the access from the clients to the different websites still aligns to the policies from previous labs.

    ## Lab 5: Uses for ACLs Other Than Interface Filtering
    In our final lab, we'll take a look at how ACLs are often part of securing control plane elements of routers.

    ### Device Access
    While username and passwords are used to ensure only authorized users are allowed to log into our routers and switches, it is good practice to limit the source networks or hosts from where network administators initiate their administrative sessions.  This prevents the risk of denial of service attacks, or attempts to brute force access.

    By attaching an ACL, most often a standard access list, to the VTY lines you can enhance the security of your network devices.

    So let's create an ACL to make sure that only `client1` can be used to administer our router.

    ```
    ip access-list standard ALLOWED-DEVICE-ADMIN
        permit host 192.168.0.17
    ```

    To attach it to the VTY lines, use the `access-class` statement.

    ```
    line vty 0 4
        access-class ALLOWED-DEVICE-ADMIN in
    ```

    Now verify that SSH access to the router only works now from `client1`.

    ```
    ssh cisco@192.168.0.1
    ```

    ### SNMP Polling and Trapping

    Like SSH, SNMP is a service that benefits from additional security protection than just a community string or credentials for SNMPv3. You can attach an ACL to the `snmp-server` configuration to ensure only authorized sources of traffic are allowed to poll the router.

    First, look at the initial SNMP configuration on the router.

    ```
    router# show run | sec snmp

    snmp-server community CCNAPREP RO
    ```

    Let's create and add an ACL that will only allow `client2` to sent SNMP requests to the router.

    ```
    ip access-list standard ALLOWED-SNMP
        permit host 192.168.0.33
    ```

    And update the SNMP server config to add this ACL.

    ```
    snmp-server community CCNAPREP RO ALLOWED-SNMP
    ```

    And verify that only `client2` can successfully poll the router with the community string.

    ```
    snmpwalk -v 2c -c CCNAPREP 192.168.0.1 1.3.6.1.2.1.1.5.0
    ```

    ### NTP Synchronization
    Many network and systems administrators will protect their NTP servers from overload by controlling what hosts are allowed to synchronize with specific masters.  This can be done with ACLs as well.  Aren't they powerful and flexible! (ACLs, not network and systems administrators...)

    We'll update the NTP configuration on `router` to only allow `client1` to communicate with it.

    First, let's see the starting configuration.

    ```
    router# show run | sec ntp

    ntp master 5
    ntp server 10.1.1.1
    ```

    And create the ACL

    ```
    ip access-list standard ALLOWED-NTP
        permit host 192.168.0.17
    ```

    And apply the ACL with the `ntp access-group` command.

    ```
    ntp access-group serve ALLOWED-NTP
    ```

    > Note: There are several different options for the types of access-group policy choices in addition to `serve` as used in this example. The details of these differences is beyond the scope of this lab and the CCNA exam.

    And finally, attempt to sync the time on the client workstations with `router`.  Only `client1` should be successful.

    ```
    ntpd -dw -p 192.168.0.1
    ```

    ## Great Job!
    Excellent work once again! This lab was designed to put you in the control seat of the traffic entering, leaving, and managing your router throught the power of Access Control Lists.  And while we focused much of the lab on the flexibility of extended ACLs, in Lab 5 we saw that standard ACLs still have their power and usefulness.

    If you'll permit me to say so, you can't deny that you are a match for hands on CCNA studies!

