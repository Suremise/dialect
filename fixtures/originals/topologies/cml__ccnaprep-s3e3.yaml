  - boot_disk_size: null
    configuration:
      - name: boot.sh
        content: |-
          # Insert more commands here
          ip address add dev eth0 172.16.0.65/24
          ip link set dev eth0 up
          ip route add default via 172.16.0.1
          echo "nameserver 192.168.255.1" > /etc/resolv.conf
          echo "192.0.2.100     internet100" >> /etc/hosts
          echo "192.0.2.200     internet200" >> /etc/hosts
          echo "192.0.2.210     internet210" >> /etc/hosts

          # Create the customized nginx.conf to serve multiple pages
          cat > /etc/nginx/nginx.conf << 'EOF'
          user  nginx;
          worker_processes  auto;

          error_log  /var/log/nginx/error.log notice;
          pid        /run/nginx.pid;


          events {
              worker_connections  1024;
          }


          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;

              log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for"';

              access_log  /var/log/nginx/access.log  main;

              sendfile        on;
              #tcp_nopush     on;

              keepalive_timeout  65;

              #gzip  on;

              # Default server - catches unmatched requests
              server {
                  listen 80 default_server;
                  server_name _;

                  location / {
                      root /usr/share/nginx/html;
                      index index.html;
                  }
              }

              # adminserver - Quantum Cloud Streaming
              server {
                  listen 8080;
                  server_name adminserver;

                  location / {
                      root /usr/share/nginx/html;
                      try_files /adminserver.html =404;
                  }
              }

          }
          EOF

          # Create a basic web page for the server
          cat > /usr/share/nginx/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
