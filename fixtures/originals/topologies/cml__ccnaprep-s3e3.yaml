                  <button class="btn-start" id="startBtn" onclick="startGame()">🎮 START GAME 🎮</button>

                  <div class="controls">
                      <button class="btn-up" onclick="changeDirection('UP')">▲</button>
                      <button class="btn-left" onclick="changeDirection('LEFT')">◄</button>
                      <button class="btn-down" onclick="changeDirection('DOWN')">▼</button>
                      <button class="btn-right" onclick="changeDirection('RIGHT')">►</button>
                  </div>

                  <div class="instructions">
                      <h3>📜 HOW TO PLAY:</h3>
                      <ul>
                          <li>🎯 Use arrow keys or buttons to control the snake</li>
                          <li>🍎 Eat the red food to grow and score points</li>
                          <li>⚠️ Don't run into walls or yourself!</li>
                          <li>🏆 Beat your high score!</li>
                          <li>💪 Pro tip: Press SPACE to pause</li>
                      </ul>
                  </div>

                  <hr>

                  <div class="visitor-counter">
                      👁️ VISITORS: <span id="visitors">001337</span> 👁️
                  </div>

                  <div class="under-construction">
                      <p>Best viewed in Netscape Navigator 4.0+ or Internet Explorer 5.0+</p>
                      <p>Optimized for 800x600 resolution</p>
                      <p>Server: internet200 | Network Simulation Lab</p>
