              <script>
                  // Animate stats counter
                  function animateValue(id, start, end, duration, suffix = '') {
                      const obj = document.getElementById(id);
                      const range = end - start;
                      const increment = end > start ? 1 : -1;
                      const stepTime = Math.abs(Math.floor(duration / range));
                      let current = start;

                      const timer = setInterval(() => {
                          current += increment * Math.ceil(range / 100);
                          if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                              current = end;
                              clearInterval(timer);
                          }
                          obj.textContent = current.toLocaleString() + suffix;
                      }, stepTime);
                  }

                  // Trigger animations when stats section is visible
                  const observerOptions = {
                      threshold: 0.5
                  };

                  const observer = new IntersectionObserver((entries) => {
                      entries.forEach(entry => {
                          if (entry.isIntersecting) {
                              animateValue('users', 0, 2500000, 2000);
                              animateValue('data', 0, 847, 2000);
                              animateValue('uptime', 0, 99.999, 2000, '');
                              animateValue('countries', 0, 142, 2000);
                              observer.unobserve(entry.target);
                          }
                      });
                  }, observerOptions);

                  observer.observe(document.getElementById('stats'));

                  // CTA Button interaction
                  document.getElementById('ctaBtn').addEventListener('click', () => {
