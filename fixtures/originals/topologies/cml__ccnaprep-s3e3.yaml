    ## Lab 1: Manage Client Access to Internal Web Servers

    For this first lab, we will use an extended ACL to enforce the policy that **all clients** should be able to reach the internal web site `http://server`, but **only `client1`** (from the primary IP address of `192.168.0.17`)should be able to reach the internal web site `http://adminserver:8080`.  Also, we should explicitly default to ***permitting*** traffic not explicitly targeted by this policy.

    Let's break the goal down into individual details so we can build and apply the ACL.

    * We are using an extended ACL, so we'll follow the rule of thumb to apply it close to the source. That would be interface `e0/1` *inbound*
    * The two web sites are hosted on the same server and IP address, but on different ports.  This means matching on destination host IP address will NOT be enough. We'll need to use protocol and port information
    * The *implicit deny* at the end of the ACL will need to be blocked by an *explicit permit*
    * While we COULD rely on the *explicit permit* to allow all clients to reach `http://server`, as it is a specific policy, we should have an ACE (access control entry) explicitly match this traffic.

    ### What exactly does "5 Tuple" mean?
    You may have heard the phrase "5 Tuple" when learning about extended ACLs... what does it actually mean?  And what is a "tuple"?

    A "tuple" is a computer engineering term that simply means a collection of data points of known meaning.  Consider the `(x,y)` grid coordinance on a graph.  That would be a tuple with 2 bits of data.  Or maybe we're working in three demensions and it's `(x,y,z)`.  Now it's a tuple with 3 bits of data.

    So a "5 tuple" is simply a set of 5 pieces of data.  For an extended access control list, the pieces of data relate to the layer 3 and 4 source and destination information for network traffic.  The 5 tuples are:

    * Protocol: The common options are `ip`, `tcp`, and `udp`. But it can also be `icmp` (ping traffic), `esp` (VPN traffic), `ospf` (a routing protocol), or any of a number of other protocols.
        > You might be wondering at the use of "words" instead of "numbers" in the tuple.  Well, the "words" are just convenient names for well known IP protocol numbers. You can look up the protocol numbers on the [IANA site](https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml)
    * Source Address: The IP address (v4 or v6) that is the source of the packet
    * Source Port: The source port number for the packet. Most commonly this would be for TCP or UDP protocol.
        > If left off, ANY source port would match the ACE
    * Destination Address: The IP address (v4 or v6) that the packet is destined for
    * Destination Port: The destination port number for the packet. Most commonly this would be for TCP or UDP protocol
        > If left off, ANY destination port would match the ACE

        > Some protocols, such as ICMP, use a "message type" instead of a port number.  For example, an ICMP echo is message "Type 8" and an echo-reply is a "Type 0"

    By combining these 5 pieces of data, extended access control lists offer flexibility in matching specific types of traffic with each access control entry.

    ### Creating the ACL

    We'll use a named ACL because the self-documentation available with a name is almost always worth the slightly extra typing.

    We'll start with the rules for the web site access.

    ```
    ip access-list extended FROM-CLIENTS
        permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080
        deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080
        permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 80
    ```

    Make note of how the `permit` for the admin server is listed before the `deny`.  This is because of the need to put more specific entries before more general ones.  If they were reversed, the `permit` would never be matched.

    Before we add the explicit permit at the end, take a look at the current state of the ACL.

    ```
    router# show ip access-list FROM-CLIENTS

    Extended IP access list FROM-CLIENTS
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www
    ```

    First up, see how port 80 is listed as `www` in line 30?  That is because many of the well known application/port details have aliases in IOS (and other networking operating systems). When available, you can leverage the "friendly name" instead of the port.

    And second, the default line numbers assigned to ACLs start at `10` and increment by `10s`.  You can override the line number and choose your own to insert ACEs into an ACL, or to purposefully space them out.  Like we will in the next step.

    Let's add the explicit permit as line `1000` to provide plenty of room for additional ACEs in the future.

    ```
    ip access-list extended FROM-CLIENTS
        1000 permit ip any any
    ```

    This statement will allow any IP based traffic (which is nearly all traffic) from anywhere to anywhere to pass through this ACL and interface unaffected.

    Now we're ready to apply the interface

    ### Applying the ACL

    With the ACL created, we simply need to apply it to the interface on `router`.

    ```
    interface e0/1
      ip access-group FROM-CLIENTS in
    ```

    And confirm it is applied to the interface with the `show ip interface` command.

    ```
    router# show ip interface e0/1 | inc access list

      Outgoing Common access list is not set
      Outgoing access list is not set
      Inbound Common access list is not set
      Inbound access list is FROM-CLIENTS
    ```

    > If you're like me, you're wondering about the `Common access list` in the output. This refers to an advanced feature called ACL Chaining which is out of scope for CCNA.

    ### Testing the ACL

    Finally, verify that the ACL is operating as expected by running these tests.

    * From `client1`
        * Access to `http://server` should work
        * Access to `http://adminserver:8080` should work
        * Access to `http://internet100` should work
        * Pinging `internet100` should work
        * Pinging `server` should work
    * From `client2`
        * Access to `http://server` should work
        * Access to `http://adminserver:8080` should <span style="background-color: red;">NOT</span> work
        * Access to `http://internet100` should work
        * Pinging `internet100` should work
        * Pinging `server` should work

    After all the tests are complete, check the ACL again with the show command on `router`. You should see matches on all ACEs.

    ```
    router# show ip access-list interface e0/1

    Extended IP access list FROM-CLIENTS
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080 (10 matches)
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080 (1 match)
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www (16 matches)
        1000 permit ip any any (62 matches)
    ```

    ## Lab 2: Allow Only Client 1 to Ping Simulated Internet Hosts
    In our second lab we have been asked by security to prevent all clients other than `client1` (using its primary IP address) from sending ping packets (ie `echo`) to *Simulated* Internet Hosts.  Clients should still be able to ping hosts on private IP ranges as detalied in RFC1918.

    > Note: When attempting to match "Internet destinations", use the default network as the destination - or `0.0.0.0/0`. The keyword `any` can be used in ACEs for this address.

    Let's breakdown this policy into some specific details that we can write ACEs for.

    * We'll be restricting access from the Client network, so we'll want to add statements to the existing `FROM-CLIENTS` ACL
    * We'll need to match on the `icmp` protocol for each of the ACEs
    * We need to ALLOW `echo` from `client1` to `any`
    * We need to DENY `echo` from other clients to `any`
    * We need to ALLOW `echo` from all clients to the private IP networks of `192.168.0.0/16`, `172.16.0.0/20`, `10.0.0.0/8`
    * The order of the ACEs will be important - be sure the most specific ACEs come before the general ones.

    ### Creating the ACL

    See if you can come up with the correct ACEs to add to the `FROM-CLIENTS` ACL and then compare with the answer.

    <details><summary>Answer</summary>

    This configuration will add the new ACEs after the web browsing entries but before the `permit any any` at the end.

    ```
    ip access-list extended FROM-CLIENTS
        100 permit icmp 192.168.0.0 0.0.0.255 192.168.0.0 0.0.0.255 echo
        110 permit icmp 192.168.0.0 0.0.0.255 172.16.0.0 0.0.240.255 echo
        120 permit icmp 192.168.0.0 0.0.0.255 10.0.0.0 0.255.255.255 echo
        130 permit icmp host 192.168.0.17 any echo
        140 deny icmp 192.168.0.0 0.0.0.255 any echo
    ```

    > Note: The order of the lines 100 - 130 is not critical. As they are all permit statements, and there is no specific/general issue they could be in any order and have the same result. Line 140 *must* come last in this list or it would match traffic intended to hit the previous entries in this list.

    Check the complete ACL after changes.

    ```
    router# show ip access-list FROM-CLIENTS

    Extended IP access list FROM-CLIENTS
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080 (10 matches)
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080 (1 match)
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www (16 matches)
        100 permit icmp 192.168.0.0 0.0.0.255 192.168.0.0 0.0.0.255 echo
        110 permit icmp 192.168.0.0 0.0.0.255 172.16.0.0 0.0.240.255 echo
        120 permit icmp 192.168.0.0 0.0.0.255 10.0.0.0 0.255.255.255 echo
        130 permit icmp host 192.168.0.17 any echo
        140 deny icmp 192.168.0.0 0.0.0.255 any echo
        1000 permit ip any any (780 matches)
    ```

    </details>

    As this ACL is already applied to the interface, there is nothing we need to do to activate these changes.

    > Keep in mind updates to an inplace ACL take effect as soon as you configure them. In a production network, it is possible to disrupt traffic or potentially disconnect remote management sessions to a router if ACL changes are not properly planned out.

    ### Testing the policy is working

    We will run the same tests from Lab 1, however the results for some of the tests will change from before.

    > Note: We are re-testing the web site access to ensure our changes have not disrupted other traffic. This is a good practice to get into.

    * From `client1`
        * Access to `http://server` should work
        * Access to `http://adminserver:8080` should work
        * Access to `http://internet100` should work
        * Pinging `internet100` should work
        * Pinging `server` should work
    * From `client2`
        * Access to `http://server` should work
        * Access to `http://adminserver:8080` should <span style="background-color: red;">NOT</span> work
        * Access to `http://internet100` should work
        * Pinging `internet100` should <span style="background-color: red;">NOT</span> work
        * Pinging `server` should work

    And check the counters on the ACLs to see which statements matched traffic and which did not.

    ```
    router# show ip access-list FROM-CLIENTS

    Extended IP access list FROM-CLIENTS
        10 permit tcp host 192.168.0.17 host 172.16.0.65 eq 8080 (20 matches)
        20 deny tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq 8080 (2 matches)
        30 permit tcp 192.168.0.0 0.0.0.255 host 172.16.0.65 eq www (32 matches)
        100 permit icmp 192.168.0.0 0.0.0.255 192.168.0.0 0.0.0.255 echo
        110 permit icmp 192.168.0.0 0.0.0.255 172.16.0.0 0.0.240.255 echo (6 matches)
        120 permit icmp 192.168.0.0 0.0.0.255 10.0.0.0 0.255.255.255 echo
