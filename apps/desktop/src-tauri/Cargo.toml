# The desktop app's shell: a window around the frontend in ../dist, and the dialog and fs plugins it opens and saves
# files with. No conversion logic lives here: that runs in the webview, from the same TypeScript as the web build.
[package]
name = "dialect"
version = "0.0.0"
description = "Dialect: translates network device configs between vendor dialects"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
