# Checks every push to main and every pull request: types, lint, unit tests and the license check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Node 24 bundles npm 11, which still runs unreviewed install scripts. npm 12 runs only those allowScripts
      # approves (package.json pins npm@12.2.0; tests/installScripts.test.ts checks it).
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # npm test already checks this (tests/licenses.test.ts); here it has its own line in the log.
      - run: npm run licenses -- --check

  # The desktop app: both NSIS installers and the standalone dialect.exe (kept as build artifacts, never released),
  # cargo-deny on its crates, the smoke test (apps/desktop/e2e), which drives the built app through Edge WebDriver
  # attached to its WebView2, and dialect.exe run with no Node on the PATH.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      # The standalone dialect.exe is this Node's node.exe: the version scripts/notices/node.md gives the license of
      # (packages/cli/scripts/build-exe.mjs refuses another).
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # cargo-deny goes in ~/.cargo-tools, apart from ~/.cargo/bin (rustup's), so it caches on its own.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-cargo-deny-0.20
      # cargo install skips a tool whose cached version is still the newest that meets the requirement.
      - name: Install cargo-deny
        run: |
          $tools = Join-Path $HOME '.cargo-tools'
          cargo install cargo-deny --locked --version ^0.20 --root $tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Join-Path $tools 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: cargo deny
        working-directory: apps/desktop/src-tauri
        run: cargo deny --locked check
      # The smoke test needs the msedgedriver of the runner's WebView2 runtime, whose version EdgeUpdate records.
      - name: Download msedgedriver for the installed WebView2
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction Stop).pv
          if (-not $version) { throw "No WebView2 version under $key" }
          Write-Output "WebView2 $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "MSEDGEDRIVER=$(Join-Path $dir 'msedgedriver.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Both installers (Darren's decision on #89): the normal one and the offline one, each with dialect.exe inside.
      - run: npm run build:installers -w @dialect/desktop
      # Builds the app again without the installer, with its debugging port, into src-tauri/target/e2e (the smoke test's
      # header says why: WebView2 ignores a driver's debugging port in an elevated process, as on these runners).
      - run: npm run test:smoke -w @dialect/desktop
      # The dialect command needs no Node: run it with every folder holding a node.exe taken off the PATH.
      - name: dialect.exe runs with no Node
        run: |
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'node is still on the PATH' }
          & packages/cli/dist/dialect.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'system { host-name r1; }' | & packages/cli/dist/dialect.exe display-set -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dialect-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dialect-cli
          path: packages/cli/dist/dialect.exe
          if-no-files-found: error
          retention-days: 14
